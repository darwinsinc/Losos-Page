                <tr>
                    <th class="px-4 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider sticky left-0 bg-slate-100 z-10 min-w-[200px]">Colaborador / Día</th>
            `;
            for (let d = 1; d <= daysCount; d++) {
                headerTr += `<th class="px-2 py-3 text-center text-xs font-bold text-slate-700 w-10">${d}</th>`;
            }
            for (let d = daysCount + 1; d <= 31; d++) {
                headerTr += `<th class="px-2 py-3 text-center text-xs font-bold text-slate-300 w-10 opacity-40">${d}</th>`;
            }
            headerTr += `</tr>`;
            thead.innerHTML = headerTr;

            const monthKey = `${currentYear}-${currentSelectedMonth}`;
            if (!attendanceData[monthKey]) {
                attendanceData[monthKey] = {};
            }

            // Build Body Rows
            activeEmployeesInArea.forEach(emp => {
                if (!attendanceData[monthKey][emp.id]) {
                    attendanceData[monthKey][emp.id] = {};
                }

                let row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition-colors";
                
                let htmlContent = `
                    <td class="px-4 py-3 whitespace-nowrap sticky left-0 bg-white z-10 border-r border-slate-200">
                        <div class="font-bold text-slate-900">${emp.nombre} ${emp.apellido}</div>
                        <div class="text-[11px] text-slate-500 flex gap-2">
                            <span>ID: ${emp.id}</span>
                            <span>•</span>
                            <span class="uppercase font-semibold text-primary-600">${emp.agencia}</span>
                            <span class="ml-2 text-emerald-700 font-bold">${getEmployeeMonthHours(emp.id, monthKey)} h</span>
                        </div>
                    </td>
                `;

                for (let d = 1; d <= 31; d++) {
                    if (d <= daysCount) {
                        const status = attendanceData[monthKey][emp.id][d] || '';
                        let badgeClass = 'bg-slate-100 text-slate-400 hover:bg-slate-200';
                        if (status === 'X') badgeClass = 'bg-emerald-600 text-white font-bold shadow-sm';
                        if (status === 'O') badgeClass = 'bg-red-600 text-white font-bold shadow-sm';
                        if (status === 'U') badgeClass = 'bg-blue-600 text-white font-bold shadow-sm';
                        const hours = getWorkHours(emp.id, monthKey, d);

                                    class="ml-1 w-12 h-7 text-center text-[10px] border border-slate-300 rounded-md ${status === 'X' ? 'bg-white' : 'bg-slate-100 text-slate-400'}"

        // Control aislado por trabajador y día.
        const attendanceActionStamp = new Map();
        function cycleAttendance(empId, day) {
            const monthKey = `${currentYear}-${currentSelectedMonth}`;
            attendanceData[monthKey] ||= {};
            attendanceData[monthKey][empId] ||= {};
            const actionKey = `${monthKey}|${String(empId)}|${day}`;
            const now = performance.now();
            if (now - (attendanceActionStamp.get(actionKey) || -Infinity) < 260) return;
            attendanceActionStamp.set(actionKey, now);
            const current = attendanceData[monthKey][empId][day] || '';
            const next = current === '' ? 'X' : current === 'X' ? 'O' : current === 'O' ? 'U' : '';
            if (next) {
                attendanceData[monthKey][empId][day] = next;
                workHoursData[monthKey] ||= {};
                workHoursData[monthKey][empId] ||= {};
                workHoursData[monthKey][empId][day] = next === 'X' ? 12 : 0;
            } else {
                delete attendanceData[monthKey][empId][day];
                if (workHoursData?.[monthKey]?.[empId]) delete workHoursData[monthKey][empId][day];
            }
            saveData();
            renderAttendanceTable();
            if (typeof renderLiveOperations === 'function') renderLiveOperations();
            if (typeof renderScheduleSupportBanner === 'function') renderScheduleSupportBanner();
        }
        function setupAttendanceInteractions() {
            const tbody = document.getElementById('attendance-tbody');
            if (!tbody || tbody.dataset.attendanceBound === '1') return;
            tbody.dataset.attendanceBound = '1';
            tbody.addEventListener('click', event => {
                const button = event.target.closest('[data-attendance-button="1"]');
                if (!button || !tbody.contains(button)) return;
                event.preventDefault();
                event.stopPropagation();
                cycleAttendance(button.dataset.employeeId, Number(button.dataset.day));
            }, true);
        }

            const workers = employees

                .sort((a,b) => {
                    const last = (a.apellido || '').localeCompare((b.apellido || ''), 'es', { sensitivity: 'base' });
                    return last || (a.nombre || '').localeCompare((b.nombre || ''), 'es', { sensitivity: 'base' });
                });

            const summaryRows = workers.map(emp => {
                const attendance = attendanceData?.[monthKey]?.[emp.id] || {};
                const daysWorked = Object.keys(attendance).reduce((count, day) => count + (attendance[day] === 'X' ? 1 : 0), 0);
                const hoursWorked = getEmployeeMonthHours(emp.id, monthKey);
                return [emp.apellido || '', emp.nombre || '', emp.area || area, emp.agencia || '', daysWorked, Number(hoursWorked.toFixed(2))];
            });

            const detailRows = [];
            const daysCount = getDaysInMonth(currentYear, currentSelectedMonth);
            workers.forEach(emp => {
                const attendance = attendanceData?.[monthKey]?.[emp.id] || {};
                const hours = workHoursData?.[monthKey]?.[emp.id] || {};
                for (let day = 1; day <= daysCount; day++) {
                    const status = attendance[day] || '';
                    detailRows.push([
                        day,
                        `${String(day).padStart(2,'0')}/${String(currentSelectedMonth + 1).padStart(2,'0')}/${currentYear}`,
                        emp.apellido || '',
                        emp.nombre || '',
                        emp.agencia || '',
                        status || '—',
                        status === 'X' ? Number((Number(hours[day] || 0)).toFixed(2)) : 0
                    ]);
                }
            });

            const wb = XLSX.utils.book_new();

            const summaryAoa = [
                ['ŁOSOS SP Z O. O. · CIERRE MENSUAL'],
                [`CONTROL DE ASISTENCIA · ${area}`, `${monthName.toUpperCase()} ${currentYear}`],
                [''],
                ['APELLIDO', 'NOMBRE', 'ÁREA', 'AGENCIA', 'DÍAS TRABAJADOS', 'HORAS REALIZADAS'],
                ...summaryRows,
                [''],
                ['TOTAL DEL ÁREA', '', '', '',
                    summaryRows.reduce((sum, row) => sum + Number(row[4] || 0), 0),
                    Number(summaryRows.reduce((sum, row) => sum + Number(row[5] || 0), 0).toFixed(2))
                ]
            ];

            const wsSummary = XLSX.utils.aoa_to_sheet(summaryAoa);
            wsSummary['!merges'] = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 5 } },
                { s: { r: 1, c: 0 }, e: { r: 1, c: 3 } }
            ];
            wsSummary['!cols'] = [
                { wch: 24 }, { wch: 24 }, { wch: 21 }, { wch: 20 }, { wch: 18 }, { wch: 18 }
            ];
            wsSummary['!rows'] = [{ hpt: 28 }, { hpt: 22 }, { hpt: 8 }, { hpt: 24 }];
            wsSummary['!autofilter'] = { ref: `A4:F${Math.max(4, 4 + summaryRows.length)}` };
            wsSummary['!freeze'] = { xSplit: 0, ySplit: 4 };

            const detailAoa = [
                ['ŁOSOS SP Z O. O. · DETALLE DIARIO'],
                [`ÁREA: ${area}`, `MES: ${monthName.toUpperCase()} ${currentYear}`],
                [''],
                ['DÍA', 'FECHA', 'APELLIDO', 'NOMBRE', 'AGENCIA', 'ESTADO', 'HORAS'],
                ...detailRows
            ];
            const wsDetail = XLSX.utils.aoa_to_sheet(detailAoa);
            wsDetail['!merges'] = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 6 } },
                { s: { r: 1, c: 0 }, e: { r: 1, c: 2 } }
            ];
            wsDetail['!cols'] = [
                { wch: 8 }, { wch: 14 }, { wch: 24 }, { wch: 24 }, { wch: 20 }, { wch: 12 }, { wch: 12 }
            ];
            wsDetail['!rows'] = [{ hpt: 28 }, { hpt: 22 }, { hpt: 8 }, { hpt: 24 }];
            wsDetail['!autofilter'] = { ref: `A4:G${Math.max(4, 4 + detailRows.length)}` };
            wsDetail['!freeze'] = { xSplit: 0, ySplit: 4 };

            // Hoja adicional para Norma, cuando existan registros en el mes seleccionado.
            const normaRows = [];
            Object.values(normaRecords || {}).forEach(records => {
                (Array.isArray(records) ? records : []).forEach(record => {
                    if (!record || !record.date) return;
                    const recordDate = new Date(record.date + 'T00:00:00');
                    if (recordDate.getFullYear() !== currentYear || recordDate.getMonth() !== currentSelectedMonth) return;
                    const emp = employees.find(e => String(e.id) === String(record.workerId));
                    if (!emp || emp.area !== 'PRODUCCIÓN') return;
                    normaRows.push([
                        record.date,
                        emp.apellido || '',
                        emp.nombre || '',
                        record.reason || '',
                        record.start || '',
                        record.end || '',
                        Number(record.hours || 0)
                    ]);
                });
            });
            normaRows.sort((a,b) => String(a[0]).localeCompare(String(b[0])) || String(a[1]).localeCompare(String(b[1])));
            const normaAoa = [
                ['ŁOSOS SP Z O. O. · NORMA'],
                [`REGISTROS DE NORMA · ${monthName.toUpperCase()} ${currentYear}`],
                [''],
                ['FECHA', 'APELLIDO', 'NOMBRE', 'MOTIVO', 'DESDE', 'HASTA', 'HORAS'],
                ...normaRows
            ];
            const wsNorma = XLSX.utils.aoa_to_sheet(normaAoa);
            wsNorma['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:6} }];
            wsNorma['!cols'] = [{wch:14},{wch:24},{wch:24},{wch:14},{wch:10},{wch:10},{wch:12}];
            wsNorma['!rows'] = [{hpt:28},{hpt:22},{hpt:8},{hpt:24}];
            wsNorma['!autofilter'] = {ref:`A4:G${Math.max(4,4+normaRows.length)}`};
            wsNorma['!freeze'] = {xSplit:0,ySplit:4};

            // Estilo básico de celdas. Si la versión CE del exportador no aplica estilos,
            // la estructura, anchos, filtros y congelación siguen manteniendo el informe ordenado.
            [wsSummary, wsDetail, wsNorma].forEach(ws => {
                if (ws['A1']) ws['A1'].s = { font:{bold:true,sz:16,color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'111827'}}, alignment:{horizontal:'center',vertical:'center'} };
                const lastCol = ws === wsSummary ? ['A','B','C','D','E','F'] : ['A','B','C','D','E','F','G'];
                lastCol.forEach(col => {
                    const head = ws[`${col}4`];
                    if (head) head.s = { font:{bold:true,color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'334155'}}, alignment:{horizontal:'center',vertical:'center'} };
                });
            });

            XLSX.utils.book_append_sheet(wb, wsSummary, 'Cierre Mensual');
            XLSX.utils.book_append_sheet(wb, wsDetail, 'Detalle Diario');
            XLSX.utils.book_append_sheet(wb, wsNorma, 'NORMA');

            const fileMonth = String(currentSelectedMonth + 1).padStart(2, '0');
            const safeArea = area.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            XLSX.writeFile(wb, `cierre-mensual-${safeArea}-${currentYear}-${fileMonth}.xlsx`, { compression: true });
            showNotification('Cierre Mensual generado correctamente.', 'success');
        }

        function getWorkHours(empId, monthKey, day) {
            return Number(workHoursData?.[monthKey]?.[empId]?.[day] ?? 0);
        }

        function getEmployeeMonthHours(empId, monthKey) {
            const days = workHoursData?.[monthKey]?.[empId] || {};
            return Object.values(days).reduce((sum, h) => sum + Number(h || 0), 0);
        }

        function setWorkHours(empId, day, value) {
            const monthKey = `${currentYear}-${currentSelectedMonth}`;
            const status = attendanceData?.[monthKey]?.[empId]?.[day] || '';
            if (status !== 'X') {
                showNotification('Las horas solo se pueden registrar para días con asistencia (X).', 'error');
                renderAttendanceTable();
                return;
            }
            const hours = Math.max(0, Math.min(24, Number(value) || 0));
            if (!workHoursData[monthKey]) workHoursData[monthKey] = {};
            if (!workHoursData[monthKey][empId]) workHoursData[monthKey][empId] = {};
            workHoursData[monthKey][empId][day] = hours;
            saveData();
            renderAttendanceTable();
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function getScheduleSelection() {
            const month = parseInt(document.getElementById('schedule-month').value);
            const week = parseInt(document.getElementById('schedule-week').value);
            const year = currentYear;
            const startDay = (week - 1) * 7 + 1;
            const daysInMonth = getDaysInMonth(year, month);
            if (startDay > daysInMonth) return null;
            const endDay = Math.min(startDay + 6, daysInMonth);
            return { year, month, week, startDay, endDay };
        }

        function getScheduleKey() {
            const area = document.getElementById('schedule-area').value;
            const selection = getScheduleSelection();
            return area && selection ? `${selection.year}-${selection.month}-W${selection.week}__${area}` : '';
        }

        function formatScheduleWeekLabel(selection) {
            if (!selection) return 'SEMANA NO DISPONIBLE';
            const monthName = new Date(selection.year, selection.month, 1)
                .toLocaleDateString('es-ES', { month: 'long' }).toUpperCase();
            return `${monthName} · SEMANA ${selection.week}`;
        }

        function updateScheduleWeekOptions() {
            const monthEl = document.getElementById('schedule-month');
            const weekSelect = document.getElementById('schedule-week');
            if (!monthEl || !weekSelect) return;
            const month = parseInt(monthEl.value);
            const daysInMonth = getDaysInMonth(currentYear, month);
            [...weekSelect.options].forEach((option, index) => {
                const startDay = index * 7 + 1;
                const endDay = Math.min(startDay + 6, daysInMonth);
                option.disabled = startDay > daysInMonth;
                option.textContent = `SEMANA ${index + 1}`;
            });
            const selected = getScheduleSelection();
            document.getElementById('schedule-week-range').textContent =
                selected ? formatScheduleWeekLabel(selected) : 'SEMANA NO DISPONIBLE';
        }

        function renderSchedule() {
            const areaEl = document.getElementById('schedule-area');
            if (!areaEl) return; // La sección de horarios solo existe en la página del Jefe
            const area = areaEl.value;
            const prompt = document.getElementById('schedule-prompt');
            const content = document.getElementById('schedule-content');
            updateScheduleWeekOptions();
            const selection = getScheduleSelection();
            if (!area || !selection) {
                prompt.classList.remove('hidden'); prompt.classList.add('flex');
                content.classList.add('hidden'); return;
            }

            prompt.classList.add('hidden'); prompt.classList.remove('flex');
            content.classList.remove('hidden');

            const active = employees.filter(e => e.estado === 'Activo' && e.area === area);
            const key = getScheduleKey();
            const schedule = shiftSchedule[key] || { turno1: [], turno2: [], turno3: [], requirements: {turno1:0,turno2:0,turno3:0} };
            ['turno1','turno2','turno3'].forEach(shift => {
                const tbody = document.getElementById(`${shift}-tbody`);
                const ids = schedule[shift] || [];
                const people = ids.map(id => employees.find(e => e.id === id)).filter(Boolean);
                tbody.innerHTML = people.length ? people.map(e => `<tr draggable="true" ondragstart="startShiftDrag(event, '${e.id}', '${shift}')" class="border-b border-slate-100 cursor-grab active:cursor-grabbing hover:bg-primary-50/50 transition-colors">
                        <td class="px-4 py-3 font-bold">${e.id}</td>
                        <td class="px-4 py-3 font-semibold"><i class="fa-solid fa-grip-vertical mr-2 text-slate-300"></i>${e.nombre} ${e.apellido}</td>
                        <td class="px-4 py-3">${e.agencia}</td>
                        <td class="px-4 py-3">${e.area}</td>
                    </tr>`).join('') :
                    `<tr><td colspan="4" class="px-4 py-8 text-center text-slate-400">Sin trabajadores asignados</td></tr>`;
                document.getElementById(`${shift}-count`).textContent = `${people.length} asignados`;
            });
            document.getElementById('available-workers').textContent = `${active.length} trabajadores disponibles`;
            const supportCount = document.getElementById('schedule-support-count');
            if (supportCount) { const refs = getProductionSupportIdsForDate(new Date().toISOString().slice(0,10)); const supportNames = refs.map(id=>employees.find(e=>String(e.id)===String(id))).filter(Boolean); supportCount.textContent = `${supportNames.length} apoyos`; supportCount.title = supportNames.length ? `Apoyo: ${supportNames.map(e=>e.apellido).join(', ')}` : 'Sin personal de apoyo'; }
            renderScheduleSupportBanner();
        }

        // ============================================================
        // PANEL EN VIVO DEL JEFE — 3 TURNOS
        // ============================================================
        function timeToMinutes(value) { if (!value) return 0; const parts=String(value).split(':').map(Number); return (parts[0]||0)*60+(parts[1]||0); }
        function isNowInsideShift(start,end,nowMinutes) { const a=timeToMinutes(start),b=timeToMinutes(end); if(a===b)return true; return b>a?(nowMinutes>=a&&nowMinutes<b):(nowMinutes>=a||nowMinutes<b); }
        function renderScheduleSupportBanner() {
            const banner=document.getElementById('schedule-support-banner');
            const list=document.getElementById('schedule-support-banner-list');
            const countEl=document.getElementById('schedule-support-banner-count');
            if(!banner||!list)return;
            const area=document.getElementById('schedule-area')?.value||'';
            const isProduction=String(area).toUpperCase()==='PRODUCCIÓN';
            banner.classList.toggle('hidden',!isProduction);
            if(!isProduction)return;
            const date=new Date().toISOString().slice(0,10);
            const ids=getProductionSupportIdsForDate(date);
            const people=ids.map(id=>employees.find(e=>String(e.id)===String(id))).filter(Boolean);
            if(countEl)countEl.textContent=String(people.length);
            list.innerHTML=people.length?people.map(e=>{ const entry=(productionSupport?.[date]||[]).find(item=>String(item?.workerId ?? item)===String(e.id)); const range=(entry?.start&&entry?.end)?` · ${escapeNormaHtml(entry.start)}–${escapeNormaHtml(entry.end)}`:''; return `<div class="schedule-support-person"><i class="fa-solid fa-user-plus"></i><div><strong>${escapeNormaHtml(e.apellido)}</strong><span>${escapeNormaHtml(e.nombre)} · Área original: ${escapeNormaHtml(e.area||'')}${range}</span></div></div>`; }).join(''):'<div class="support-empty">No hay personal de apoyo para hoy.</div>';
        }

        function renderLiveOperations() {
            const grid=document.getElementById('live-area-counters'), totalEl=document.getElementById('live-total-active'), clockEl=document.getElementById('live-clock'), dateEl=document.getElementById('live-date');
            if(!grid||!totalEl)return; const now=new Date();
            if(clockEl)clockEl.textContent=now.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
            if(dateEl)dateEl.textContent=now.toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
            const areas=['PRODUCCIÓN','ETIQUETA','DESCONGELACIÓN','AHUMADOS']; const shifts=[{key:'turno1',label:'T1',time:'06:30–18:30'},{key:'turno2',label:'T2',time:'10:30–22:30'},{key:'turno3',label:'T3',time:'18:30–06:30'}]; let total=0;
            const refDate=(shift)=>{ const d=new Date(now); const m=now.getHours()*60+now.getMinutes(); if(shift==='turno3'&&m<1110)d.setDate(d.getDate()-1); return d; };
            const getSchedule=(date)=>{const week=Math.floor((date.getDate()-1)/7)+1, out={}; areas.forEach(area=>{const key=`${date.getFullYear()}-${date.getMonth()}-W${week}__${area}`;out[area]=shiftSchedule[key]||{turno1:[],turno2:[],turno3:[]};});return out;};
            const active=(emp,shift,ref)=>{const mk=`${ref.getFullYear()}-${ref.getMonth()}`,day=ref.getDate();if((attendanceData?.[mk]?.[emp.id]?.[day]||'')!=='X')return false;const cfg={turno1:{start:'06:30',end:'18:30'},turno2:{start:'10:30',end:'22:30'},turno3:{start:'18:30',end:'06:30'}}[shift];
            const hours=Number(workHoursData?.[mk]?.[emp.id]?.[day]||12);
            if(!cfg)return false; const nm=now.getHours()*60+now.getMinutes();
            if(!isNowInsideShift(cfg.start,cfg.end,nm))return false;
            if(hours<12){const st=timeToMinutes(cfg.start),elapsed=nm>=st?nm-st:nm+1440-st;if(elapsed>=hours*60)return false;}
            return true;};
            grid.innerHTML=areas.map(area=>{const counts=shifts.map(sh=>{const ref=refDate(sh.key), sc=getSchedule(ref)[area]||{}, ids=Array.isArray(sc[sh.key])?sc[sh.key]:[], count=ids.map(id=>employees.find(e=>e.id===id)).filter(Boolean).filter(emp=>emp.estado==='Activo'&&emp.area===area&&active(emp,sh.key,ref)).length; total+=count; return count;});const sum=counts.reduce((a,b)=>a+b,0);return `<article class="live-area-card ${sum?'has-active':''}"><div class="live-area-top"><div class="live-area-name">${area}</div><span class="live-area-indicator"></span></div><div class="live-area-count"><strong>${sum}</strong><span>activas ahora</span></div><div class="live-area-shifts">${shifts.map((sh,i)=>`<span class="live-shift-chip"><i class="fa-solid ${sh.icon}"></i><span>${sh.label} · ${sh.time}</span><b>${counts[i]}</b></span>`).join('')}</div></article>`;}).join('');
            totalEl.textContent=`${total} ${total===1?'persona activa':'personas activas'}`;
            const supportEl=document.getElementById('live-support-additional');
            if(supportEl){
                const today=now.toISOString().slice(0,10), minuteNow=now.getHours()*60+now.getMinutes();
                const activeSupport=(productionSupport?.[today]||[]).map(item=>{
                    const e=employees.find(x=>String(x.id)===String(item?.workerId ?? item));
                    if(!e||e.estado!=='Activo') return null;
                    const st=item?.start||'', en=item?.end||'';
                    const sm=st?timeToMinutes(st):null, em=en?timeToMinutes(en):null;
                    const inWindow=sm!==null&&em!==null ? (sm<=em ? minuteNow>=sm&&minuteNow<em : minuteNow>=sm||minuteNow<em) : true;
                    return inWindow ? {e,start:st,end:en} : null;
                }).filter(Boolean);
                supportEl.classList.toggle('hidden', activeSupport.length===0);
                supportEl.innerHTML=activeSupport.length ? `<div class="live-support-additional-head"><span><i class="fa-solid fa-user-plus"></i> Adicionales · Apoyo en Producción</span><strong>${activeSupport.length}</strong></div><div class="live-support-additional-list">${activeSupport.map(({e,start,end})=>`<div class="live-support-person"><div><strong>${escapeNormaHtml(e.apellido)}</strong><span>${escapeNormaHtml(e.nombre)} · Área original: ${escapeNormaHtml(e.area||'')} · ${escapeNormaHtml(start)}–${escapeNormaHtml(end)}</span></div><b>ADICIONAL</b></div>`).join('')}</div>` : '';
            }
        }

        function saveShiftRequirements() {
            const area = document.getElementById('schedule-area').value;
            const selection = getScheduleSelection();
            if (!area || !selection) { showNotification('Seleccione obligatoriamente el mes, la semana y el área del horario.', 'error'); return; }
            const key = getScheduleKey();
            const req = {
                turno1: Math.max(0, parseInt(document.getElementById('req-turno1').value) || 0),
                turno2: Math.max(0, parseInt(document.getElementById('req-turno2').value) || 0),
                turno3: Math.max(0, parseInt(document.getElementById('req-turno3').value) || 0)
            };
            if (!shiftSchedule[key]) shiftSchedule[key] = { turno1: [], turno2: [], turno3: [] };
            shiftSchedule[key].requirements = req;
            saveData();
            showNotification('Necesidades de personal guardadas para la semana seleccionada.', 'success');
        }

        function mixWorkersRandomly() {
            const area = document.getElementById('schedule-area').value;
            const selection = getScheduleSelection();
            if (!area || !selection) { showNotification('Seleccione obligatoriamente el mes, la semana y el área del horario.', 'error'); return; }
            saveShiftRequirements();
            const key = getScheduleKey();
            const req = shiftSchedule[key].requirements || {turno1:0,turno2:0,turno3:0};
            const active = shuffleArray(employees.filter(e => e.estado === 'Activo' && e.area === area));
            const total = req.turno1 + req.turno2 + req.turno3;
            if (total > active.length) {
                showNotification(`Se necesitan ${total} personas, pero solo hay ${active.length} disponibles en esta área.`, 'error');
                return;
            }
            shiftSchedule[key].turno1 = active.slice(0, req.turno1).map(e => e.id);
            shiftSchedule[key].turno2 = active.slice(req.turno1, req.turno1 + req.turno2).map(e => e.id);
            shiftSchedule[key].turno3 = active.slice(req.turno1 + req.turno2, total).map(e => e.id);
            saveData(); renderSchedule();
            showNotification(`Trabajadores mezclados y distribuidos aleatoriamente en ${formatScheduleWeekLabel(selection)}.`, 'success');
        }

        function loadScheduleRequirements() {
            const areaEl = document.getElementById('schedule-area');
            if (!areaEl) return;
            updateScheduleWeekOptions();
            const selection = getScheduleSelection();
            const key = getScheduleKey();
            const req = shiftSchedule?.[key]?.requirements || {turno1:0,turno2:0,turno3:0};
            document.getElementById('req-turno1').value = req.turno1;
            document.getElementById('req-turno2').value = req.turno2;
            document.getElementById('req-turno3').value = req.turno3;
            renderSchedule();
        }


        let draggedShiftWorker = null;

        function startShiftDrag(event, empId, fromShift) {
            draggedShiftWorker = { empId, fromShift };
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', empId);
        }

        function setupShiftDropZones() {
            ['turno1','turno2','turno3'].forEach(shift => {
                const tbody = document.getElementById(`${shift}-tbody`);
                if (!tbody || tbody.dataset.dropReady === '1') return;
                tbody.dataset.dropReady = '1';

                tbody.addEventListener('dragover', e => {
                    if (!draggedShiftWorker) return;
                    e.preventDefault();
                    e.stopPropagation();
                    e.dataTransfer.dropEffect = 'move';
                    tbody.classList.add('bg-primary-50');
                });

                tbody.addEventListener('dragenter', e => {
                    if (!draggedShiftWorker) return;
                    e.preventDefault();
                    tbody.classList.add('bg-primary-50');
                });

                tbody.addEventListener('dragleave', e => {
                    if (!tbody.contains(e.relatedTarget)) {
                        tbody.classList.remove('bg-primary-50');
                    }
                });

                tbody.addEventListener('drop', e => {
                    e.preventDefault();
                    e.stopPropagation();
                    tbody.classList.remove('bg-primary-50');
                    if (!draggedShiftWorker) return;
                    const { empId, fromShift } = draggedShiftWorker;
                    draggedShiftWorker = null;
                    moveWorkerToShift(empId, fromShift, shift);
                });
            });
        }

        document.addEventListener('dragend', () => {
            draggedShiftWorker = null;
            ['turno1','turno2','turno3'].forEach(shift => {
                const tbody = document.getElementById(`${shift}-tbody`);
                if (tbody) tbody.classList.remove('bg-primary-50');
            });
        });

        function moveWorkerToShift(empId, fromShift, toShift) {
            if (fromShift === toShift) return;
            const key = getScheduleKey();
            if (!key) return;
            if (!shiftSchedule[key]) shiftSchedule[key] = {turno1:[],turno2:[],turno3:[],requirements:{turno1:0,turno2:0,turno3:0}};
            ['turno1','turno2','turno3'].forEach(s => {
                shiftSchedule[key][s] = (shiftSchedule[key][s] || []).filter(id => id !== empId);
            });
            shiftSchedule[key][toShift].push(empId);
            saveData();
            renderSchedule();
            showNotification('Trabajador movido manualmente de turno.', 'success');
        }

        function downloadScheduleCSV() {
            const area = document.getElementById('schedule-area').value;
            const selection = getScheduleSelection();
            const key = getScheduleKey();
            if (!area || !selection || !shiftSchedule[key]) {
                showNotification('Seleccione mes, semana y área y genere el horario antes de descargarlo.', 'error');
                return;
            }

            const schedule = shiftSchedule[key];
            const rows = [['Apellido','Nombre','Agencia','Área','Semana','Turno']];
            ['turno1','turno2','turno3'].forEach((shift, i) => {
                (schedule[shift] || []).forEach(id => {
                    const e = employees.find(emp => emp.id === id);
                    if (e) rows.push([e.apellido, e.nombre, e.agencia, e.area, formatScheduleWeekLabel(selection), `Turno ${i + 1}`]);
                });
            });
            if (rows.length === 1) {
                showNotification('No hay trabajadores asignados para descargar.', 'error');
                return;
            }
            const csv = rows.map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n');
            const blob = new Blob(["\ufeff" + csv], {type:'text/csv;charset=utf-8;'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `losos_bd_${selection.year}-${String(selection.month+1).padStart(2,'0')}_semana_${selection.week}_${area}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }


        function formatTableDate(dateString) {
            if(!dateString) return '';
            const parts = dateString.split('-');
            if(parts.length !== 3) return dateString;
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function showNotification(message, type = 'success') {
            const existingToast = document.getElementById('toast-notification');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-notification';
            const bgColor = type === 'error' ? 'bg-red-600' : type === 'info' ? 'bg-slate-900' : 'bg-emerald-600';
            
            toast.className = `fixed bottom-5 right-5 z-50 ${bgColor} text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-medium animate-bounce`;
            toast.innerHTML = `
                <i class="fa-solid fa-circle-info text-base"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        window.addEventListener('beforeunload', () => { try { saveData(); } catch(e) {} });
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { try { saveData(); } catch(e) {} } });

        // Cada "página" (fragmento) inicializa únicamente las secciones que
        // realmente contiene. runPageInit() se llama tanto en la carga inicial
        // como después de cada navegación interna (SPA) para reinicializar la
        // sección visible.
        let __lososLiveInterval = null;
        function runPageInit() {
            updateLanguageSpecificUI();
            if (__lososLiveInterval) { clearInterval(__lososLiveInterval); __lososLiveInterval = null; }
            if (document.getElementById('employees-tbody')) renderRegistroTable();
            if (document.getElementById('history-tbody')) renderHistoryTable();
            setupEmployeeForm();
            setupEditEmployeeForm();
            if (document.getElementById('select-area-asistencia')) {
                renderAttendanceTable();
                setupAttendanceInteractions();
                updateProductionAssistanceMenu();
                renderProductionSupport();
                ['production-start-time','production-end-time'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.addEventListener('input', updateNormaDurationPreview);
                    if (el) el.addEventListener('change', updateNormaDurationPreview);
                });
                updateNormaDurationPreview();
                const awariaReason = document.getElementById('awaria-reason');
                const awariaDate = document.getElementById('awaria-date');
                if (awariaReason) awariaReason.addEventListener('change', renderAwariaWorkerList);
                if (awariaDate) awariaDate.addEventListener('change', renderAwariaWorkerList);
            }
            if (document.getElementById('norma-history-tbody')) {
                populateNormaHistoryFilters();
                renderNormaHistory();
                ['norma-edit-start','norma-edit-end'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) { el.addEventListener('input', updateNormaEditPreview); el.addEventListener('change', updateNormaEditPreview); }
                });
            }
            if (document.getElementById('schedule-area')) {
                loadScheduleRequirements();
                setupShiftDropZones();
            }
            if (document.getElementById('live-area-counters')) {
                renderLiveOperations(); renderNormaRankingBanners(); renderScheduleSupportBanner();
                __lososLiveInterval = setInterval(()=>{ renderLiveOperations(); renderNormaRankingBanners(); renderScheduleSupportBanner(); }, 1000);
            }
            showAutoSaveIndicator('Cambios guardados');
            applyIconMapping();
        }
        window.onload = runPageInit;

        // ============================================================
        // MOTOR DE NAVEGACIÓN SPA (una sola página real, sin iframes)
        // ============================================================
        function roleGuard(requiredRole) {
            try {
                if (sessionStorage.getItem('losos_role') !== requiredRole) {
                    navigate('index.html');
                    return false;
                }
            } catch (e) {}
            return true;
        }

        function selectProfile(role, page) {
            sessionStorage.setItem('losos_role', role);
            navigate(page);
        }

        function toggleSchedulePanel(open) {
            const shell = document.getElementById('schedule-panel-shell');
            const launch = document.querySelector('.schedule-launch-section');
            if (!shell) return;
            shell.classList.toggle('hidden', !open);
            if (launch) launch.classList.toggle('hidden', open);
            if (open) {
                shell.scrollIntoView({ behavior: 'smooth', block: 'start' });
                if (typeof loadScheduleRequirements === 'function') loadScheduleRequirements();
            }
        }

        function applyIconMapping() {
            const map = {
                'language':'languages','clipboard-list':'clipboard-list','cloud-arrow-up':'cloud-upload','calendar-check':'calendar-check-2',
                'calendar':'calendar-days','filter':'filter','right-from-bracket':'log-out','shield-halved':'shield-check',
                'users':'users','users-slash':'user-round-x','pencil':'pencil','trash-can':'trash-2','plus':'plus',
                'minus':'minus','rotate-right':'rotate-ccw','file-export':'file-down','link':'link-2','user-check':'user-check',
                'search':'search','xmark':'x','edit':'pencil','pen':'pen-line','save':'save','download':'download','upload':'upload',
                'times':'x','check':'check','check-circle':'circle-check','exclamation-triangle':'triangle-alert','info-circle':'info',
                'bars':'menu','home':'house','cog':'settings','database':'database','file':'file','folder':'folder',
                'clock':'clock-3','chevron-down':'chevron-down','chevron-up':'chevron-up','chevron-left':'chevron-left',
                'chevron-right':'chevron-right','arrow-left':'arrow-left','arrow-right':'arrow-right','copy':'copy','print':'printer',
                'eye':'eye','eye-slash':'eye-off','lock':'lock','unlock':'unlock','sign-out-alt':'log-out','user':'user',
                'user-plus':'user-plus','chart-bar':'chart-column','chart-line':'chart-line','check-double':'check-check',
                'times-circle':'circle-x','question-circle':'circle-help','spinner':'loader-circle','sync':'refresh-cw',
                'sliders-h':'sliders-horizontal','list':'list','th':'grid-2x2','star':'star','heart':'heart','bookmark':'bookmark',
                'external-link-alt':'external-link','cloud-upload-alt':'cloud-upload','cloud-download-alt':'cloud-download',
                'box':'box','boxes':'boxes','tags':'tags','money-bill':'banknote','phone':'phone','envelope':'mail',
                'map-marker-alt':'map-pin','bell':'bell','bell-slash':'bell-off','globe':'globe-2','bars-staggered':'menu',
                'calendar-days':'calendar-days','clipboard':'clipboard','users-cog':'users-round'
            };
            document.querySelectorAll('i[class*="fa-"]').forEach(function(el){
                const classes=[...el.classList];
                const key=classes.map(c=>c.replace(/^fa-(?:solid|regular|brands|light|thin|duotone)-/, '').replace(/^fa-/,'')).find(k=>map[k]);
                if(!key || !window.lucide) return;
                el.setAttribute('data-lucide',map[key]);
                el.className='lucide-icon '+el.className.split(' ').filter(c=>!c.startsWith('fa-')).join(' ');
            });
            if(window.lucide) window.lucide.createIcons({attrs:{'stroke-width':1.9}});
        }

        const ROLE_REQUIREMENTS = {
            'personal.html': 'personal',
            'coordinador.html': 'coordinador',
            'jefe.html': 'jefe',
            'norma.html': 'coordinador'
        };

        function navigate(page) {
            const body = (typeof PAGE_BODIES !== 'undefined' && PAGE_BODIES[page]) ? PAGE_BODIES[page] : null;
            if (!body) { page = 'index.html'; }
            document.title = (typeof PAGE_TITLES !== 'undefined' && PAGE_TITLES[page]) ? PAGE_TITLES[page] : document.title;
            if (typeof PAGE_BODY_CLASSES !== 'undefined' && PAGE_BODY_CLASSES[page] !== undefined) {
                document.body.className = PAGE_BODY_CLASSES[page];
            }
            document.body.innerHTML = (typeof PAGE_BODIES !== 'undefined' && PAGE_BODIES[page]) ? PAGE_BODIES[page] : '';
            window.scrollTo(0, 0);
            const required = ROLE_REQUIREMENTS[page];
            if (required && !roleGuard(required)) return;
            runPageInit();
        }
    
</script>

<script>
  navigate('index.html');
</script>

</body>
