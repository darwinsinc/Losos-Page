        /* Custom smooth scrolling and minimal scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fefefe; 
        }
        ::-webkit-scrollbar-thumb {
            background: #dadada; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a4a4a4; 
        }
        
        /* Smooth tab transitions */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

            width: 100%;

            transition: all 0.2s;
            background-color: #ffffff;
        }
        .form-input:focus {
            border-color: #8b8b8b;
            box-shadow: 0 0 0 3px rgba(139,139,139,0.15);
        }

            min-width: 105px;

:root{

}

/* Tipografía y superficie general más elegante */
body{
  letter-spacing:.005em;
  background:
    radial-gradient(1100px 480px at 8% -10%, rgba(51,51,51,.05), transparent 60%),
    radial-gradient(900px 420px at 100% 0%, rgba(162,162,162,.06), transparent 55%),
    linear-gradient(180deg,#fafafa 0,#ffffff 42%,#fdfdfd 100%);
}

/* Logo de marca (imagen en vez de icono) */
.brand-logo{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,#212121,#474747 55%,#4e4e4e);
  box-shadow:0 8px 18px rgba(51,51,51,.28), inset 0 0 0 1px rgba(255,255,255,.08);
  padding:7px;
}
.brand-logo img{width:100%;height:100%;object-fit:contain;display:block}

header{position:relative}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;
  background:linear-gradient(90deg,var(--primary) 0%,var(--accent) 50%,var(--primary) 100%);
  opacity:.9;
}
header h1 span.text-primary-600{color:var(--primary-2)!important}

/* Botón principal con acabado premium */
button[onclick="saveMasterFile()"]{
  background:linear-gradient(135deg,#212121,#474747)!important;
  box-shadow:0 8px 18px rgba(33,33,33,.28);
}
button[onclick="saveMasterFile()"]:hover{
  box-shadow:0 10px 22px rgba(33,33,33,.34);
  transform:translateY(-1px);
}

/* Realce sutil de las tarjetas al pasar el cursor */
.bg-white.rounded-2xl.shadow-sm{transition:box-shadow .2s ease, transform .2s ease}

/* Pestañas activas con acento dorado */
.tab-btn.bg-white{position:relative}
.tab-btn.bg-white::after{
  content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;
  background:var(--accent);border-radius:2px;opacity:.85;
}

  position:relative;overflow:hidden;min-height:46px!important;
  padding:.72rem 1.25rem!important;border-radius:13px!important;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s ease,color .25s ease,box-shadow .25s ease!important;
}
.tab-btn:before{
  content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.65),transparent);
  transform:translateX(-120%);transition:transform .6s ease;
}
.tab-btn:hover{transform:translateY(-2px)!important;color:var(--primary)!important}
.tab-btn:hover:before{transform:translateX(120%)}
.tab-btn.active,.tab-btn[aria-selected="true"]{
  background:#ffffff!important;color:var(--primary)!important;
  box-shadow:0 8px 22px rgba(33,33,33,.10)!important;border:1px solid #eeeeee!important;
}

/* ============================================================
   ŁOSOS ONLINE · Refinamiento editorial blanco / negro / plata
   ============================================================ */
:root{
  --primary:#0f0f0f;
  --primary-2:#3a3a3a;
  --ink:#080808;
  --muted:#717171;
  --line:#e6e6e6;
  --surface:#ffffff;
  --surface-soft:#fefefe;
  --silver:#bcbcbc;
  --shadow:0 14px 40px rgba(8,8,8,.08);
}
html{background:#fcfcfc;color:#080808}
body{background:linear-gradient(180deg,#ffffff 0%,#f9f9f9 100%)!important;color:#080808!important}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.72),transparent 34%,rgba(0,0,0,.02) 72%,transparent);z-index:-1}

.header-language{border-color:#dcdcdc!important;background:#ffffff!important;color:#2a2a2a!important}
.header-language select{background:transparent!important;color:#191919!important}
.btn-logout{background:#0f0f0f!important;color:#ffffff!important;border-color:#0f0f0f!important;box-shadow:0 5px 16px rgba(0,0,0,.14)!important}
.btn-logout:hover{background:#2a2a2a!important;transform:translateY(-1px)}
main{max-width:1280px!important}
.card,.bg-white.rounded-lg,.bg-white.rounded-xl{background:rgba(255,255,255,.96)!important;border-color:#e5e5e5!important;box-shadow:0 16px 45px rgba(0,0,0,.075)!important}
.bg-slate-50,.bg-gray-50{background:#fefefe!important}
.bg-slate-100,.bg-gray-100{background:#f6f6f6!important}

.text-slate-700,.text-gray-700{color:#434343!important}
.text-slate-600,.text-gray-600{color:#616161!important}

.bg-blue-600,.bg-blue-700{background:#181818!important;color:#ffffff!important}

.border-primary-300,.border-primary-200{border-color:#c2c2c2!important}

button,.btn,.px-4.py-2,.px-3.py-2{border-radius:11px}

input,select,textarea{border-color:#d7d7d7!important;background:#ffffff!important;color:#0f0f0f!important;box-shadow:none!important}
input:focus,select:focus,textarea:focus{border-color:#696969!important;box-shadow:0 0 0 3px rgba(0,0,0,.07)!important}
thead th{background:#f8f8f8!important;color:#383838!important;border-color:#dfdfdf!important}

.attendance-export-panel{margin-top:1rem;padding:1.15rem 1.2rem;border:1px solid #dedede;border-radius:18px;background:linear-gradient(135deg,#ffffff 0%,#f9f9f9 100%);box-shadow:0 12px 30px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;gap:1rem}

@media(max-width:720px){.attendance-export-panel{flex-direction:column;align-items:stretch}.attendance-export-btn{justify-content:center;width:100%}}

/* Microinteracciones del sistema */
.card,.profile-card,.attendance-export-panel{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.card:hover,.profile-card:hover{transform:translateY(-2px);box-shadow:0 20px 52px rgba(0,0,0,.09)!important;border-color:#cccccc}
.tab-btn{transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease!important}

/* ============================================================
   MEJORAS RESPONSIVE ADICIONALES · AJUSTES UNIVERSALES
   Se añaden al final para complementar (no reemplazar) las
   reglas existentes, garantizando buena visualización en
   cualquier dispositivo: móviles, tablets, laptops y pantallas
   grandes.
   ============================================================ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { overflow-x: hidden; width: 100%; }
img, svg { max-width: 100%; height: auto; }
* { -webkit-tap-highlight-color: transparent; }

/* Evita el zoom automático de iOS en formularios (campos < 16px disparan zoom) */
@media (max-width: 767px) {
  input, select, textarea, button { font-size: 16px !important; }
}

/* Botones e inputs con área táctil cómoda en pantallas pequeñas */
@media (max-width: 640px) {
  .form-input, input, select, textarea { min-height: 44px; }
  button, .profile-enter-btn, .btn-logout, .tab-btn, .norma-assign-btn,
  .schedule-launch-btn, .awaria-open-btn { min-height: 44px; }
}

/* Cabecera: permite que el bloque de marca se acomode en pantallas muy angostas */
@media (max-width: 480px) {
  header .max-w-7xl { flex-wrap: wrap; row-gap: 6px; }
  .index-brand-header h1 { font-size: 1.05rem !important; }
  .module-page-title { font-size: 1rem !important; }
  .language-global select, .header-language select { font-size: .68rem !important; }
}

/* Tarjetas de perfil (login) en columna única en móviles muy pequeños */
@media (max-width: 400px) {
  .login-card-outer { padding: 18px 14px !important; }
  .login-hero h1 { font-size: 1.35rem !important; }
  .profile-card { padding: 18px 14px !important; }
}

/* Formularios de alta/edición de trabajador: una sola columna en móvil */
@media (max-width: 640px) {
  #employee-form, #edit-employee-form { grid-template-columns: 1fr !important; }
}

/* Tablas genéricas: aseguran scroll horizontal contenido y no fuga de layout */
.overflow-x-auto { -webkit-overflow-scrolling: touch; }
table { max-width: none; }

/* Modales / diálogos: se ajustan al ancho de pantalla con márgenes seguros */
dialog.norma-dialog, #edit-employee-modal > div {
  max-width: min(640px, calc(100vw - 24px)) !important;
  width: 100% !important;
}
@media (max-width: 480px) {
  .norma-dialog-inner { padding: 16px !important; }
  .norma-dialog-grid { grid-template-columns: 1fr !important; }
}

/* Grillas de resumen / KPIs en columna única en pantallas pequeñas */
@media (max-width: 560px) {
  .norma-summary-grid, .norma-top-grid, .live-area-grid { grid-template-columns: 1fr !important; }
}

/* Panel de horarios: columnas de turnos apiladas en móvil */
@media (max-width: 900px) {
  .grid.grid-cols-1.lg\:grid-cols-3 { grid-template-columns: 1fr !important; }
}

/* Soporte para dispositivos con notch (safe-area) */
@supports (padding: max(0px)) {
  header, .app-footer { padding-left: max(0px, env(safe-area-inset-left)); padding-right: max(0px, env(safe-area-inset-right)); }
}

/* Pantallas muy grandes: limita el ancho de lectura sin dejar de usar el espacio */
@media (min-width: 1600px) {
  .max-w-7xl { max-width: 100rem; }
}

  "personal.html": "\n\n    <header class=\"bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20\">\n        <div class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between\">\n            <div class=\"flex items-center gap-3\">\n                <div>\n                    <h1 class=\"module-page-title\">Personal</h1>\n                </div>\n            </div>\n\n            <div class=\"flex items-center gap-3\">\n                <div id=\"autosave-indicator\" class=\"hidden sm:flex items-center gap-1.5 text-xs font-medium text-emerald-600 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-lg transition-all duration-300\">\n                    <i class=\"fa-solid fa-cloud-arrow-up text-emerald-500\"></i>\n                    <span id=\"autosave-text\">Cambios guardados automáticamente</span>\n                </div>\n                <div class=\"text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 hidden md:block\" id=\"current-date\"></div>\n                <div class=\"language-global header-language\"><i class=\"fa-solid fa-language\"></i><select id=\"language-selector\" aria-label=\"Idioma\" onchange=\"setLanguage(this.value)\"><option value=\"es\">ES</option><option value=\"pl\">PL</option></select></div>\n                <button class=\"btn-logout\" onclick=\"logout()\" title=\"Volver al menú de perfiles\">\n                    <i class=\"fa-solid fa-right-from-bracket\"></i> <span class=\"hidden sm:inline\">Cerrar sesión</span>\n                </button>\n            </div>\n        </div>\n    </header>\n\n    <main class=\"flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full\">\n        </div>\n\n        <nav class=\"flex flex-wrap gap-2 bg-slate-200/60 p-1.5 rounded-2xl mb-8 border border-slate-300/50 w-fit\" aria-label=\"Tabs\">\n            <button onclick=\"switchTab('registro')\" id=\"btn-registro\" class=\"tab-btn px-5 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 flex items-center gap-2 bg-white text-primary-700 shadow-sm border border-slate-200\">\n                <i class=\"fa-solid fa-users text-primary-600\"></i>\n                Nómina Registrada\n            </button>\n            <button onclick=\"switchTab('historial')\" id=\"btn-historial\" class=\"tab-btn px-5 py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 flex items-center gap-2 text-slate-600 hover:text-slate-900 hover:bg-white/50\">\n                <i class=\"fa-solid fa-clock-rotate-left text-slate-500\"></i>\n                Historial de Bajas\n                <span id=\"history-badge\" class=\"ml-1 px-2 py-0.5 text-xs font-bold bg-slate-200 text-slate-700 rounded-full\">0</span>\n            </button>\n        </nav>\n\n        <div id=\"tab-registro\" class=\"tab-content active space-y-6\">\n\n            <div class=\"bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden\">\n                <div class=\"px-6 py-4 border-b border-slate-100 bg-slate-50/70 flex justify-between items-center\">\n                    <div>\n                        <h2 class=\"text-base font-bold text-slate-900\"><i class=\"fa-solid fa-user-plus mr-2 text-primary-600\"></i>Registrar Nuevo Trabajador</h2>\n                        <p class=\"text-xs text-slate-500\">Los nuevos ingresos se activan automáticamente. Con “Unirme”, la persona queda incluida directamente en el listado de Personal Activo.</p>\n                    </div>\n                </div>\n\n                <div class=\"p-6\">\n                    <form id=\"employee-form\" class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5\">\n\n                        <div class=\"space-y-1.5\">\n                            <label for=\"emp-id\" class=\"block text-xs font-bold uppercase tracking-wider text-slate-600\">ID / Documento</label>\n                            <input type=\"text\" id=\"emp-id\" required placeholder=\"Ej: 10452391\" class=\"form-input\">\n                        </div>\n\n                        <div class=\"space-y-1.5\">\n                            <label for=\"emp-apellido\" class=\"block text-xs font-bold uppercase tracking-wider text-slate-600\">Apellidos</label>\n                            <input type=\"text\" id=\"emp-apellido\" required placeholder=\"Ej: Ramírez Soto\" class=\"form-input\">\n                        </div>\n\n                        <div class=\"space-y-1.5\">\n                            <label for=\"emp-nombre\" class=\"block text-xs font-bold uppercase tracking-wider text-slate-600\">Nombres</label>\n                            <input type=\"text\" id=\"emp-nombre\" required placeholder=\"Ej: Valeria Sofía\" class=\"form-input\">\n                        </div>\n\n                        <div class=\"space-y-1.5\">\n                            <label for=\"emp-agencia\" class=\"block text-xs font-bold uppercase tracking-wider text-slate-600\">Agencia</label>\n                            <select id=\"emp-agencia\" required class=\"form-input cursor-pointer\">\n                                <option value=\"\" disabled selected>Seleccione agencia...</option>\n                                <option value=\"JOBMIRO\">JOBMIRO</option>\n                                <option value=\"SREBNA\">SREBNA</option>\n                                <option value=\"TIWAS\">TIWAS</option>\n                                <option value=\"MAIIR\">MAIIR</option>\n                            </select>\n                        </div>\n\n                        <div class=\"space-y-1.5\">\n                            <label for=\"emp-fecha\" class=\"block text-xs font-bold uppercase tracking-wider text-slate-600\">Fecha de Ingreso</label>\n                            <input type=\"date\" id=\"emp-fecha\" required class=\"form-input\">\n                        </div>\n\n                        <div class=\"space-y-1.5\">\n                            <label for=\"emp-area\" class=\"bloc   "coordinador.html": "\n\n    <header class=\"bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20\">\n        <div class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between\">\n            <div class=\"flex items-center gap-3\">\n                <div>\n                    <h1 class=\"module-page-title\">Asistencia</h1>\n                </div>\n            </div>\n\n            <div class=\"flex items-center gap-3\">\n                <div id=\"autosave-indicator\" class=\"hidden sm:flex items-center gap-1.5 text-xs font-medium text-emerald-600 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-lg transition-all duration-300\">\n                    <i class=\"fa-solid fa-cloud-arrow-up text-emerald-500\"></i>\n                    <span id=\"autosave-text\">Cambios guardados automáticamente</span>\n                </div>\n                <div class=\"text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 hidden md:block\" id=\"current-date\"></div>\n                <div class=\"language-global header-language\"><i class=\"fa-solid fa-language\"></i><select id=\"language-selector\" aria-label=\"Idioma\" onchange=\"setLanguage(this.value)\"><option value=\"es\">ES</option><option value=\"pl\">PL</option></select></div>\n                <button class=\"btn-logout\" onclick=\"logout()\" title=\"Volver al menú de perfiles\">\n                    <i class=\"fa-solid fa-right-from-bracket\"></i> <span class=\"hidden sm:inline\">Cerrar sesión</span>\n                </button>\n            </div>\n        </div>\n    </header>\n\n    <main class=\"flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full\">\n        <div id=\"tab-asistencia\" class=\"tab-content active space-y-6\">\n            <div class=\"bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col\">\n                <div class=\"px-6 py-4 border-b border-slate-100 bg-slate-50/70 flex flex-col lg:flex-row lg:justify-between lg:items-center gap-4\">\n                    <div>\n                        <h2 class=\"text-base font-bold text-slate-900\"><i class=\"fa-regular fa-calendar-check mr-2 text-primary-600\"></i>Control de Asistencia por Área</h2>\n                        <p class=\"text-xs text-slate-500\">Seleccione obligatoriamente el área de trabajo para realizar el llamado a lista mensual.</p>\n                    </div>\n\n                    <!-- Month Selector & Area Selector Toolbar -->\n                    <div class=\"flex flex-wrap items-center gap-3\">\n                        <div class=\"flex items-center gap-2 bg-white border border-slate-300 rounded-xl px-3 py-1.5 shadow-sm\">\n                            <label for=\"select-month\" class=\"text-xs font-bold uppercase text-slate-600\"><i class=\"fa-solid fa-calendar text-primary-600 mr-1\"></i> Mes:</label>\n                            <select id=\"select-month\" onchange=\"onAttendanceFilterChange()\" class=\"text-sm font-semibold text-slate-800 bg-transparent outline-none cursor-pointer\">\n                                <option value=\"0\">Enero</option>\n                                <option value=\"1\">Febrero</option>\n                                <option value=\"2\">Marzo</option>\n                                <option value=\"3\">Abril</option>\n                                <option value=\"4\">Mayo</option>\n                                <option value=\"5\">Junio</option>\n                                <option value=\"6\">Julio</option>\n                                <option value=\"7\">Agosto</option>\n                                <option value=\"8\">Septiembre</option>\n                                <option value=\"9\">Octubre</option>\n                                <option value=\"10\">Noviembre</option>\n                                <option value=\"11\">Diciembre</option>\n                            </select>\n                        </div>\n\n                        <div class=\"flex items-center gap-2 bg-white border border-primary-300 rounded-xl px-3 py-1.5 shadow-sm\">\n                            <label for=\"select-area-asistencia\" class=\"text-xs font-bold uppercase text-primary-700\"><i class=\"fa-solid fa-filter mr-1\"></i> Área:</label>\n                            <select id=\"select-area-asistencia\" onchange=\"onAttendanceFilterChange()\" class=\"text-sm font-bold text-primary-900 bg-transparent outline-none cursor-pointer capitalize\">\n                                <option value=\"\" disabled selected>-- Seleccione área --</option>\n                                <option value=\"PRODUCCIÓN\">PRODUCCIÓN</option>\n                                <option value=\"ETIQUETA\">ETIQUETA</option>\n                                <option value=\"DESCONGELACIÓN\">DESCONGELACIÓN</option>\n                                <option value=\"AHUMADOS\">AHUMADOS</option>\n                            </select>\n                        </div>\n                    </div>\n                </div>\n\n                <!-- Legend Bar -->\n                <div class=\"bg-slate-50 px-6 py-2.5 border-b border-slate-200/60 flex flex-wrap gap-4 text-xs font-semibold text-slate-700\">\n                    <span class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded bg-emerald-600 text-white flex items-center justify-center text-[9px] font-bold\">X</span> Presente</span>\n                    <span class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded bg-red-600 text-white flex items-center justify-center text-[9px] font-bold\">O</span> Ausente</span>\n                    <span class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded bg-blue-600 text-white flex items-center justify-center text-[9px] font-bold\">U</span> Vacaciones</span>\n                </div>\n\n\n\n                <!-- Horizontal scrollable attendance matrix -->\n                <div class=\"overflow-x-auto w-full\">\n                    <table class=\"w-full divide-y divide-slate-200 border-collapse\">\n                        <thead class=\"bg-slate-100\" id=\"attendance-thead\">\n                            <!-- Injected dynamically based on days in month -->\n                        </thead>\n                        <tbody id=\"attendance-tbody\" class=\"bg-white divide-y divide-slate-100 text-xs\">\n                            <!-- Injected dynamically -->\n                        </tbody>\n                    </table>\n                </div>\n\n                <!-- Mandatory Prompt State (When no area selected) -->\n                <div id=\"empty-state-asistencia-prompt\" class=\"flex flex-col items-center justify-center py-20 text-center px-4\">\n                    <div class=\"w-16 h-16 bg-primary-50 rounded-full flex items-center justify-center text-primary-600 mb-4 shadow-inner\">\n                        <i class=\"fa-solid fa-list-check text-2xl\"></i>\n                    </div>\n                    <h3 class=\"text-base font-bold text-slate-900\">Seleccione un Área de Trabajo</h3>\n                    <p class=\"text-xs text-slate-500 mt-1 max-w-sm\">Para visualizar el control de asistencia y realizar el llamado a lista, es obligatorio seleccionar primero un área en el menú superior derecho.</p>\n                </div>\n\n\n                <!-- Empty State (When area selected but no workers active in it) -->\n                <div id=\"empty-state-asistencia-none\" class=\"hidden flex-col items-center justify-center py-20 text-center px-4\">\n                    <div class=\"w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 mb-4 shadow-inner\">\n                        <i class=\"fa-solid fa-user-xmark text-2xl\"></i>\n                    </div>\n                    <h3 class=\"text-sm font-bold text-slate-900\">No hay trabajadores activos en esta área</h3>\n                    <p class=\"text-xs text-slate-500 mt-1\">El perfil de Personal aún no ha registrado trabajadores en esta área.</p>\n                </div>\n\n\n                <!-- NORMA: función exclusiva para PRODUCCIÓN -->\n                <section id=\"production-assistance-menu\" class=\"production-assistance-panel hidden\" aria-live=\"polite\">\n                    <div class=\"production-assistance-head\">\n                        <div>\n                            <span class=\"production-kicker\"><i class=\"fa-solid fa-industry\"></i> Área de producción</span>\n                            <h3>NORMA</h3>\n                            <p>Registra el tiempo de un trabajador según el motivo. El sistema calcula automáticamente las horas: por ejemplo, de 06:00 a 06:30 = 0,5 h y de 06:00 a 06:45 = 0,75 h.</p>\n                        </div>\n                        <div class=\"production-status\"><i class=\"fa-solid fa-lock\"></i> Solo Producción</div>\n                    </div>\n\n                    <div class=\"production-assistance-grid norma-entry-grid\">\n                        <div class=\"production-control-card\">\n                            <span class=\"production-control-label\"><i class=\"fa-solid fa-user\"></i> Trabajador</span>\n                            <select id=\"production-worker-select\" class=\"production-select\" aria-label=\"Seleccionar trabajador\">\n                                <option value=\"\">Seleccionar trabajador</option>\n                            </select>\n                        </div>\n\n                        <div class=\"production-control-card\">\n                            <span class=\"production-control-label\"><i class=\"fa-solid fa-list-check\"></i> Motivo</span>\n                            <select id=\"production-reason-select\" class=\"production-select\" aria-label=\"Seleccionar motivo\">\n                                <option value=\"\">Seleccionar motivo</option>\n                                <option value=\"odlew\">odlew</option>\n                                <option value=\"zamyk\">zamyk</option>\n                                <option value=\"paprika\">paprika</option>\n                                <option value=\"z-e\">z-e</option>\n                            </select>\n                        </div>\n\n                        <div class=\"production-control-card norma-time-card\">\n                            <span class=\"production-control-label\"><i class=\"fa-regular fa-clock\"></i> Desde</span>\n                            <input id=\"production-start-time\" class=\"production-time-input\" type=\"time\" aria-label=\"Hora de inicio\">\n                        </div>\n\n                        <div class=\"production-control-card norma-time-card\">\n                            <span class=\"production-control-label\"><i class=\"fa-solid fa-hourglass-half\"></i> Hasta</span>\n                            <input id=\"production-end-time\" class=\"production-time-input\" type=\"time\" aria-label=\"Hora de finalización\">\n                        </div>\n\n                        <div class=\"production-duration-preview\" aria-live=\"polite\">\n                            <span>Tiempo calculado</span>\n                            <strong id=\"production-duration-preview\">0 h</strong>\n                        </div>\n\n                        <button type=\"button\" id=\"save-production-assistance\" class=\"production-save-btn\" onclick=\"saveProductionAssistanceRecord()\">\n                            <i class=\"fa-solid fa-plus\"></i>\n                            <span>Agregar tiempo</span>\n                        </button>\n                    </div>\n\n                    <div class=\"norma-history-link-wrap\">\n                        <button type=\"button\" class=\"awaria-open-btn\" onclick=\"openAwariaPanel()\">\n                            <span><i class=\"fa-solid fa-triangle-exclamation\"></i> AWARIA</span>\n                            <span class=\"awaria-open-arrow\"><i class=\"fa-solid fa-chevron-right\"></i></span>\n                        </button>\n                        <a href=\"#\" onclick=\"navigate('norma.html'); return false;\" class=\"norma-history-link\">\n                            <span><i class=\"fa-solid fa-clock-rotate-left\"></i> Ver historial NORMA</span>\n                            <i class=\"fa-solid fa-arrow-right\"></i>\n                        </a>\n                    </div>\n\n                    <dialog id=\"awaria-dialog\" class=\"norma-dialog awaria-dialog\">\n                        <div class=\"norma-dialog-inner\">\n                            <div class=\"norma-dialog-head\">\n                                <div><span class=\"production-kicker\"><i class=\"fa-solid fa-triangle-exclamation\"></i> Producción</span><h3>AWARIA</h3><p class=\"text-xs text-slate-500 mt-1\">Selecciona una awaria y marca con X a las personas que tendrán esa norma adicional.</p></div>\n                                <button type=\"button\" class=\"norma-dialog-cancel\" onclick=\"closeAwariaPanel()\" aria-label=\"Cerrar\">✕</button>\n                            </div>\n                            <div class=\"awaria-controls\">\n                                <label>Fecha<input id=\"awaria-date\" type=\"date\"></label>\n                                <label>Awaria<select id=\"awaria-reason\"><option value=\"blokady\">blokady</option><option value=\"zamyk\">zamyk</option></select></label>\n                            </div>\n                            <div class=\"awaria-list-title\"><span>Trabajadores de Producción</span><small>Marca X para asignar la awaria adicional</small></div>\n                            <div id=\"awaria-worker-list\" class=\"awaria-worker-list\"></div>\n                            <div class=\"norma-dialog-actions\"><button type=\"button\" class=\"norma-dialog-cancel\" onclick=\"closeAwariaPanel()\">Cerrar</button></div>\n                        </div>\n                    </dialog>\n                </section>\n\n\n                <!-- Exportación al final del cuadro de asistencia -->\n                <div class=\"attendance-export-panel\">\n                    <div class=\"attendance-export-copy\">\n                        <h3>Cierre Mensual</h3>\n                    </div>\n                    <button id=\"export-attendance-excel\" type=\"button\" class=\"attendance-export-btn\" onclick=\"exportAttendanceToExcel()\">\n                        DESCARGAR CONTROL DE ASISTENCIA\n                    </button>\n                </div>\n            </div>\n        </div>\n\n    </main>\n\n    <footer class=\"app-footer\">\n        <div class=\"footer-inner\">\n            <div class=\"footer-brand\">\n                <span class=\"brand-logo\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlgAAAENCAMAAADkE+s3AAADAFBMVEUAAAAhSIcZWaAbU5sNfL4lMIAkMoAlMIAlMIANe70kMYERcbMQdLYlMIAlMIAQc7UdTo4kM4EYXZ4lMIAlMIAlMIAnNnUlMIAVZ6geT48bVpYlMYAkMYElMIAlMIAcVJQaWZkWZKUWZKUQc7UdeLYfSoolMIAkPXwSba8UaaojQH8ZW5wiRIMWY6QlO3kIiMwKgsUIiMsJhMcIh8oJhskUaasTaqwdT5AaWZooNHL/3AAlMIAPdbf///8mOHckPXsCmNwlOnkSbrAnNXMiQoEGjtIaWJgjP34DltoZXJwXYKEIiMsNerwhRoYfSoojQH8VZ6knN3UHis4hRIQTbK0RcLMWZKUYXp4ZWpsdT48JhMcVZacUaqwgSIgcU5MdUZIMfsENfL4bVZYOd7kKgcQeTY0KgsUMf8IQc7QElNgHjc8XYqMIhckUaar/4QAFkNL/5AAEktb/3gAEkdQpMG4aJob/5wAlLn8pMW8mLH0dKYQXJYgjNYIjLoH52wQiOYfv0wogLIJsaFYnKnsAnOD01wccSpUFaLogPovy9voeRI8tNnsAf9A4P3QPZ7COhEIFbLPoyw4AlOiBeUrl8PfHsiEWWaG+qyZMTmkAidvfxRMZUpsWO4sTQJEAk+FiYlzXvhhXV2J2cVC2oysUQoWkmDW0z+QAhdUWiMUSYKkEc7ocQIVDSG7e0BoNUqQQSZonZprRzSYHZKnX6fQDecGbjTuunjB8ilPS3usjcqYLXaMZNXfj6fECcMHPuBwSSYzFwCkWO33p1BGz2Ox2nWZHopsOV5sOUJQrXI/AxzPE4fEjNXu1wTsBd8kIX7EaNII2gZaqwEZqgauIuGVjhWtMmswZL3F1r9VTgrNPZGqGo1mSsFVVcKBXqo8wS4Fod1xhpM8emscyobE3bIigrkXJ1eSWqMYzhr4ojq+cx+KIt9mBpMduk7xem34/cqg6l6E6VXafwFKtsDi7yNy4wtdFYpdLiIWqv9dorX+VmkOitM6Elbg8V49McnZ2rXB1tngbt9I0AAAAOXRSTlMAzAoRG9wnzIIyNcom929AzUPLs6SV81JQrMvAXx3nmofLXsv+vO/pycveedVu8Vuce+q5zpTp8t2DXPRQAABLqklEQVR42szdS6jMURwHcBcbUWQhbLySt71HxL0Reeb9fj8Kt0n/O/55hZIF1yOJRF   "jefe.html": "\n\n    <header class=\"bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20\">\n        <div class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between\">\n            <div class=\"flex items-center gap-3\">\n                <div>\n                    <h1 class=\"module-page-title\">Panel De Control</h1>\n                </div>\n            </div>\n\n            <div class=\"flex items-center gap-3\">\n                <div id=\"autosave-indicator\" class=\"hidden sm:flex items-center gap-1.5 text-xs font-medium text-emerald-600 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-lg transition-all duration-300\">\n                    <i class=\"fa-solid fa-cloud-arrow-up text-emerald-500\"></i>\n                    <span id=\"autosave-text\">Cambios guardados automáticamente</span>\n                </div>\n                <div class=\"text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 hidden md:block\" id=\"current-date\"></div>\n                <div class=\"language-global header-language\"><i class=\"fa-solid fa-language\"></i><select id=\"language-selector\" aria-label=\"Idioma\" onchange=\"setLanguage(this.value)\"><option value=\"es\">ES</option><option value=\"pl\">PL</option></select></div>\n                <button class=\"btn-logout\" onclick=\"logout()\" title=\"Volver al menú de perfiles\">\n                    <i class=\"fa-solid fa-right-from-bracket\"></i> <span class=\"hidden sm:inline\">Cerrar sesión</span>\n                </button>\n            </div>\n        </div>\n    </header>\n\n    <main class=\"flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full\">\n        <!-- Panel en vivo: reloj + personal activo por área -->\n        <section class=\"live-operations-banner\" aria-label=\"Panel de personal activo\">\n            <div class=\"live-banner-head\">\n                <div class=\"live-clock-wrap\">\n                    <div class=\"live-clock-icon\"><i class=\"fa-solid fa-clock\"></i></div>\n                    <div>\n                        <div id=\"live-clock\" class=\"live-clock\">00:00:00</div>\n                        <div id=\"live-date\" class=\"live-date\">Cargando fecha...</div>\n                    </div>\n                </div>\n                <div class=\"live-status\"><span class=\"live-dot\"></span><span>MONITOREO EN VIVO</span></div>\n            </div>\n            <div class=\"live-banner-subtitle\">\n                <span><i class=\"fa-solid fa-users mr-1\"></i> Personal activo ahora</span>\n                <span id=\"live-total-active\">0 personas</span>\n            </div>\n            <div id=\"live-area-counters\" class=\"live-area-grid\"></div>\n            <div id=\"live-support-additional\" class=\"live-support-additional hidden\" aria-live=\"polite\"></div>\n        </section>\n\n        <section class=\"norma-dashboard-section\">\n            <div class=\"norma-dashboard-head\"><div><span class=\"production-kicker\"><i class=\"fa-solid fa-chart-line\"></i> Producción</span><h2>Top NORMA</h2><p>Puntaje individual de trabajadores de Producción.</p></div></div>\n            <div class=\"norma-top-grid\">\n                <article class=\"norma-ranking-card norma-best-card\"><div class=\"norma-card-title\"><span>TOP · MEJORES</span><small>17+</small></div><div id=\"norma-top-best-list\"></div></article>\n                <article class=\"norma-ranking-card norma-regular-card\"><div class=\"norma-card-title\"><span>NORMA · REGULAR</span><small>13–16,99</small></div><div id=\"norma-top-regular-list\"></div></article>\n                <article class=\"norma-ranking-card norma-worst-card\"><div class=\"norma-card-title\"><span>NORMA · BAJO</span><small>&lt;13</small></div><div id=\"norma-top-worst-list\"></div></article>\n            </div>\n            <article class=\"norma-editor-card norma-assignment-card\">\n                <div class=\"norma-card-title\"><span>Asignar NORMA de Producción</span><small>Selecciona un trabajador y escribe libremente su puntaje.</small></div>\n                <div class=\"norma-assignment-body\">\n                    <div class=\"norma-assignment-copy\"><strong>Asignación individual</strong><p>El valor acepta decimales como 12,34 · 15,7 · 18,25, sin limitarse a incrementos concretos.</p></div>\n                    <button type=\"button\" class=\"norma-assign-btn\" onclick=\"openNormaScoreDialog()\"><i class=\"fa-solid fa-user-plus\"></i> Asignar NORMA</button>\n                </div>\n            </article>\n            <dialog id=\"norma-score-dialog\" class=\"norma-dialog\">\n                <div class=\"norma-dialog-inner\">\n                    <div class=\"norma-dialog-head\"><div><h3>Asignar NORMA</h3><p class=\"text-xs text-slate-500 mt-1\">Escoge el trabajador y escribe el valor que corresponda.</p></div><button type=\"button\" class=\"norma-dialog-cancel\" onclick=\"closeNormaScoreDialog()\" aria-label=\"Cerrar\">✕</button></div>\n                    <div class=\"norma-dialog-grid\">\n                        <label>Trabajador<select id=\"norma-score-worker\"></select></label>\n                        <label>Valor NORMA<input id=\"norma-score-value\" type=\"text\" inputmode=\"decimal\" placeholder=\"Ej. 12,34\" autocomplete=\"off\"></label>\n                    </div>\n                    <div class=\"norma-dialog-actions\"><button type=\"button\" class=\"norma-dialog-cancel\" onclick=\"closeNormaScoreDialog()\">Cancelar</button><button type=\"button\" class=\"norma-dialog-save\" onclick=\"saveNormaScoreAssignment()\">Guardar NORMA</button></div>\n                </div>\n            </dialog>\n        </section>\n\n        <section class=\"schedule-launch-section\" aria-label=\"Acceso a horarios\">\n            <button type=\"button\" class=\"schedule-launch-btn\" onclick=\"toggleSchedulePanel(true)\">\n                <span class=\"schedule-launch-icon\"><i class=\"fa-solid fa-calendar-days\"></i></span>\n                <span class=\"schedule-launch-text\"><strong>HORARIOS</strong><small>Horario de Trabajadores por Turno</small></span>\n                <i class=\"fa-solid fa-arrow-right schedule-launch-arrow\"></i>\n            </button>\n        </section>\n\n        <div id=\"schedule-panel-shell\" class=\"schedule-panel-shell hidden\">\n            <div class=\"schedule-panel-toolbar\">\n                <div><span>HORARIOS</span><small>Horario de Trabajadores por Turno</small></div>\n                <button type=\"button\" class=\"schedule-panel-close\" onclick=\"toggleSchedulePanel(false)\"><i class=\"fa-solid fa-xmark\"></i> Cerrar</button>\n            </div>\n            <div id=\"tab-horarios\" class=\"tab-content active space-y-6\">\n            <div class=\"bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden\">\n                <div class=\"px-6 py-4 border-b border-slate-100 bg-slate-50/70 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4\">\n                    <div>\n                        <h2 class=\"text-base font-bold text-slate-900\"><i class=\"fa-solid fa-clock mr-2 text-primary-600\"></i>Horario de Trabajadores por Turno</h2>\n                        <p class=\"text-xs text-slate-500\">El área es obligatoria. Todos los turnos son de 12 horas y puedes distribuir el personal de forma rápida y visual.</p>\n                    </div>\n                    <div class=\"flex flex-wrap gap-3 items-center\">\n                        <div class=\"flex items-center gap-2 bg-white border border-slate-300 rounded-xl px-3 py-1.5 shadow-sm\">\n                            <label for=\"schedule-month\" class=\"text-xs font-bold uppercase text-slate-600\"><i class=\"fa-solid fa-calendar text-primary-600 mr-1\"></i> Mes:</label>\n                            <select id=\"schedule-month\" onchange=\"loadScheduleRequirements()\" class=\"text-sm font-semibold text-slate-800 bg-transparent outline-none cursor-pointer\">\n                                <option value=\"0\">ENERO</option><option value=\"1\">FEBRERO</option><option value=\"2\">MARZO</option>\n                                <option value=\"3\">ABRIL</option><option value=\"4\">MAYO</option><option value=\"5\">JUNIO</option>\n                                <option value=\"6\">JULIO</option><option value=\"7\">AGOSTO</option><option value=\"8\">SEPTIEMBRE</option>\n                                <option value=\"9\">OCTUBRE</option><option value=\"10\">NOVIEMBRE</option><option value=\"11\">DICIEMBRE</option>\n                            </select>\n                        </div>\n                        <div class=\"flex items-center gap-2 bg-white border border-primary-300 rounded-xl px-3 py-1.5 shadow-sm\">\n                            <label for=\"schedule-week\" class=\"text-xs font-bold uppercase text-primary-700\"><i class=\"fa-solid fa-calendar-week mr-1\"></i> Semana:</label>\n                            <select id=\"schedule-week\" onchange=\"loadScheduleRequirements()\" class=\"text-sm font-bold text-primary-900 bg-transparent outline-none cursor-pointer\">\n                                <option value=\"1\">SEMANA 1</option>\n                                <option value=\"2\">SEMANA 2</option>\n                                <option value=\"3\">SEMANA 3</option>\n                                <option value=\"4\">SEMANA 4</option>\n                                <option value=\"5\">SEMANA 5</option>\n                            </select>\n                        </div>\n                        <span id=\"schedule-week-range\" class=\"text-xs font-bold bg-slate-100 px-3 py-2 rounded-lg text-slate-600\">SEMANA 1</span>\n                        <select id=\"schedule-area\" onchange=\"loadScheduleRequirements()\" class=\"form-input !w-auto min-w-[190px] cursor-pointer\">\n                            <option value=\"\" disabled selected>-- Seleccione área --</option>\n                            <option value=\"PRODUCCIÓN\">PRODUCCIÓN</option><option value=\"ETIQUETA\">ETIQUETA</option>\n                            <option value=\"DESCONGELACIÓN\">DESCONGELACIÓN</option><option value=\"AHUMADOS\">AHUMADOS</option>\n                        </select>\n                        <span id=\"available-workers\" class=\"text-xs font-bold bg-slate-100 px-3 py-2 rounded-lg text-slate-600\">0 trabajadores disponibles</span><span id=\"schedule-support-count\" class=\"schedule-support-badge\">0 apoyos</span>\n                    </div>\n                </div>\n                <div id=\"schedule-prompt\" class=\"flex flex-col items-center justify-center py-20 text-center px-4\">\n                    <div class=\"w-16 h-16 bg-primary-50 rounded-full flex items-center justify-center text-primary-600 mb-4\"><i class=\"fa-solid fa-people-group text-2xl\"></i></div>\n                    <h3 class=\"text-base font-bold text-slate-900\">Seleccione un Área de Trabajo</h3>\n                    <p class=\"text-xs text-slate-500 mt-1\">Selecciona un área para distribuir el personal entre los tres turnos de 12 horas.</p>\n                </div>\n                <div id=\"schedule-content\" class=\"hidden p-6 space-y-6\">\n                    <div class=\"grid grid-cols-1 md:grid-cols-3 gap-4\">\n                        <div class=\"border border-slate-200 rounded-xl p-4 bg-slate-50/60\">\n                            <label class=\"text-xs font-bold uppercase text-slate-600\">Personas necesarias · Turno 1</label>\n                            <input id=\"req-turno1\" type=\"number\" min=\"0\" class=\"form-input mt-2\" value=\"0\">\n                        </div>\n                        <div class=\"border border-slate-200 rounded-xl p-4 bg-slate-50/60\">\n                            <label class=\"text-xs font-bold uppercase text-slate-600\">Personas necesarias · Turno 2</label>\n                            <input id=\"req-turno2\" type=\"number\" min=\"0\" class=\"form-input mt-2\" value=\"0\">\n                        </div>\n                        <div class=\"border border-slate-200 rounded-xl p-4 bg-slate-50/60\">\n                            <label class=\"text-xs font-bold uppercase text-slate-600\">Personas necesarias · Turno 3</label>\n                            <input id=\"req-turno3\" type=\"number\" min=\"0\" class=\"form-input mt-2\" value=\"0\">\n                        </div>\n                    </div>\n                    <div class=\"flex flex-wrap gap-3\">\n                        <button onclick=\"saveShiftRequirements()\" class=\"bg-slate-800 hover:bg-slate-700 text-white font-semibold px-5 py-2.5 rounded-lg\"><i class=\"fa-solid fa-floppy-disk mr-2\"></i>Guardar necesidades</button>\n                        <button onclick=\"mixWorkersRandomly()\" class=\"bg-primary-600 hover:bg-primary-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow-sm\"><i class=\"fa-solid fa-shuffle mr-2\"></i>Mezclar y asignar aleatoriamente</button>\n                    </div>\n                    <div class=\"grid grid-cols-1 lg:grid-cols-3 gap-5\">\n                        <div class=\"bg-white border border-slate-200 rounded-xl overflow-hidden\">\n                            <div class=\"px-4 py-3 bg-slate-50 border-b flex justify-between\"><b>Turno 1</b><span id=\"turno1-count\" class=\"text-xs font-bold text-primary-600\">0 asignados</span></div>\n                            <table class=\"w-full text-sm\"><thead class=\"bg-slate-50/70\"><tr><th class=\"px-4 py-2 text-left\">ID</th><th class=\"px-4 py-2 text-left\">Trabajador</th><th class=\"px-4 py-2 text-left\">Agencia</th><th class=\"px-4 py-2 text-left\">Área</th></tr></thead><tbody id=\"turno1-tbody\" data-shift=\"turno1\"></tbody></table>\n                        </div>\n                        <div class=\"bg-white border border-slate-200 rounded-xl overflow-hidden\">\n                            <div class=\"px-4 py-3 bg-slate-50 border-b flex justify-between\"><b>Turno 2</b><span id=\"turno2-count\" class=\"text-xs font-bold text-primary-600\">0 asignados</span></div>\n                            <table class=\"w-full text-sm\"><thead class=\"bg-slate-50/70\"><tr><th class=\"px-4 py-2 text-left\">ID</th><th class=\"px-4 py-2 text-left\">Trabajador</th><th class=\"px-4 py-2 text-left\">Agencia</th><th class=\"px-4 py-2 text-left\">Área</th></tr></thead><tbody id=\"turno2-tbody\" data-shift=\"turno2\"></tbody></table>\n                        </div>\n                        <div class=\"bg-white border border-slate-200 rounded-xl overflow-hidden\">\n                            <div class=\"px-4 py-3 bg-slate-50 border-b flex justify-between\"><b>Turno 3</b><span id=\"turno3-count\" class=\"text-xs font-bold text-primary-600\">0 asignados</span></div>\n                            <table class=\"w-full text-sm\"><thead class=\"bg-slate-50/70\"><tr><th class=\"px-4 py-2 text-left\">ID</th><th class=\"px-4 py-2 text-left\">Trabajador</th><th class=\"px-4 py-2 text-left\">Agencia</th><th class=\"px-4 py-2 text-left\">Área</th></tr></thead><tbody id=\"turno3-tbody\" data-shift=\"turno3\"></tbody></table>\n                        </div>\n                    </div>\n                    <div class=\"pt-2 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3\">\n                        <div class=\"text-xs text-slate-500\">\n                            <i class=\"fa-solid fa-arrows-up-down-left-right mr-1 text-primary-600\"></i>\n                            Arrastra cualquier trabajador entre los turnos para cambiar su asignación manualmente.\n                        </div>\n                        <button onclick=\"downloadScheduleCSV()\" class=\"bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow-sm\">\n                            <i class=\"fa-solid fa-file-csv mr-2\"></i>Descargar horario\n                        </button>\n                    </div>\n                </div>\n            </div>\         const I18N_MONTHS_PL = ["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"];

        // ============================================================
        // PERSISTENCIA AVANZADA: localStorage + estado embebido en HTML
        // (Se declara aquí arriba porque currentLanguage y otras variables
        //  la necesitan desde el principio del script)
        // ============================================================
        // Todas las páginas (Personal, Coordinador, Jefe) leen y escriben las
        // mismas claves de localStorage, por lo que quedan siempre conectadas
        // entre sí: lo que se registra en una pantalla aparece en las demás.
        const loadState = (storageKey, fallback) => {
            try {
                const stored = localStorage.getItem(storageKey);
                return stored ? JSON.parse(stored) : fallback;
            } catch (e) { return fallback; }
        };

        // ============================================================
        // SESIÓN POR PERFIL (Personal / Coordinador / Jefe)
        // ============================================================
        function logout() {
            try { sessionStorage.removeItem('losos_role'); } catch (e) {}
            navigate('index.html');
        }

        let currentLanguage = localStorage.getItem('corphr_language') || 'es';
        const i18nOriginalText = new WeakMap();
        const i18nOriginalAttrs = new WeakMap();

        function translateText(value, lang) {
            if (lang === 'es' || !value) return value;
            if (I18N_PL[value] !== undefined) return I18N_PL[value];
            let result = value;
            Object.entries(I18N_PL)
                .sort((a,b) => b[0].length - a[0].length)
                .forEach(([es, pl]) => {
                    result = result.split(es).join(pl);
                });
            Object.entries(I18N_WORDS_PL)
                .sort((a,b) => b[0].length - a[0].length)
                .forEach(([es, pl]) => {
                    result = result.replace(new RegExp(`\\b${es.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&')}\\b`, 'g'), pl);
                });
            return result;
        }

        function translateElementTree(root = document.body) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const node = walker.currentNode;
                if (!node.nodeValue.trim() || ['SCRIPT','STYLE'].includes(node.parentElement?.tagName)) continue;
                nodes.push(node);
            }
            nodes.forEach(node => {
                if (!i18nOriginalText.has(node)) i18nOriginalText.set(node, node.nodeValue);
                node.nodeValue = translateText(i18nOriginalText.get(node), currentLanguage);
            });

            root.querySelectorAll?.('*').forEach(el => {
                ['title','placeholder','aria-label'].forEach(attr => {
                    if (!el.hasAttribute(attr)) return;
                    let originals = i18nOriginalAttrs.get(el);
                    if (!originals) { originals = {}; i18nOriginalAttrs.set(el, originals); }
                    if (originals[attr] === undefined) originals[attr] = el.getAttribute(attr);
                    el.setAttribute(attr, translateText(originals[attr], currentLanguage));
                });
            });
        }

        function updateLanguageSpecificUI() {
            const dateEl = document.getElementById('current-date');
            if (dateEl) {
                const locale = currentLanguage === 'pl' ? 'pl-PL' : 'es-ES';
                const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                const text = new Date().toLocaleDateString(locale, dateOptions);
                dateEl.innerHTML = `<i class="fa-regular fa-calendar text-primary-600 mr-1.5"></i> ${text.charAt(0).toUpperCase() + text.slice(1)}`;
            }
            document.documentElement.lang = currentLanguage;
            const selector = document.getElementById('language-selector');
            if (selector) selector.value = currentLanguage;
            translateElementTree(document.body);
        }

        function setLanguage(lang) {
            currentLanguage = lang === 'pl' ? 'pl' : 'es';
            localStorage.setItem('corphr_language', currentLanguage);
            updateLanguageSpecificUI();
        }

        // Traduce también contenido dinámico generado por las funciones de renderizado.
        let applyingTranslation = false;
        const i18nObserver = new MutationObserver(mutations => {
            if (currentLanguage !== 'pl' || applyingTranslation) return;
            applyingTranslation = true;
            mutations.forEach(m => {
                m.addedNodes.forEach(node => {
                    if (node.nodeType === Node.ELEMENT_NODE) translateElementTree(node);
                    else if (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim()) {
                        if (!i18nOriginalText.has(node)) i18nOriginalText.set(node, node.nodeValue);
                        node.nodeValue = translateText(i18nOriginalText.get(node), currentLanguage);
                    }
                });
            });
            applyingTranslation = false;
        });
        i18nObserver.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['title','placeholder','aria-label'] });

        let historyLog = loadState('corphr_history', []);
        let attendanceData = loadState('corphr_attendance', {});
        // Migración: se elimina definitivamente el estado F (incapacidad).
        Object.values(attendanceData || {}).forEach(month => Object.values(month || {}).forEach(days => {
            Object.keys(days || {}).forEach(day => { if (days[day] === 'F') delete days[day]; });
        }));
        let workHoursData = loadState('corphr_work_hours', {});
        let shiftSchedule = loadState('corphr_shift_schedule', {});
        let normaRecords = loadState('corphr_norma_records', {});
        let normaScores = loadState('corphr_norma_scores', {});
        let productionSupport = loadState('corphr_production_support', {});
        let awariaRecords = loadState('corphr_awaria_records', {});

        // Compatibilidad: antes los apoyos se guardaban como IDs; ahora cada apoyo
        // conserva también su horario de inicio y fin.
        Object.keys(productionSupport || {}).forEach(date => {
            const entries = Array.isArray(productionSupport[date]) ? productionSupport[date] : [];
            productionSupport[date] = entries.map(item => {
                if (item && typeof item === 'object') return { workerId: item.workerId ?? item.id, start: item.start || '', end: item.end || '' };
                return { workerId: item, start: '', end: '' };
            }).filter(item => item.workerId != null && String(item.workerId) !== '');
        });

        employees = employees.map(emp => ({
            ...emp,

            cargo: emp.cargo || '',
            estado: emp.estado || 'Activo',
            modalidadIngreso: emp.modalidadIngreso || 'registrar'
        }));

        // Mantiene una estructura estable para los 3 turnos.
        Object.values(shiftSchedule).forEach(schedule => {
            if (!schedule || typeof schedule !== 'object') return;
            ['turno1','turno2','turno3'].forEach(shift => {
                schedule[shift] = Array.isArray(schedule[shift]) ? [...new Set(schedule[shift])] : [];
            });
            schedule.requirements = {
                turno1: Math.max(0, Number(schedule.requirements?.turno1 || 0)),
                turno2: Math.max(0, Number(schedule.requirements?.turno2 || 0)),
                turno3: Math.max(0, Number(schedule.requirements?.turno3 || 0))
            };
        });

                .filter(emp => {
                    if (!query) return true;

                        .filter(Boolean).join(' ').toLowerCase();
                    return searchable.includes(query);

                .slice()
                .sort((a, b) => {
                    const first = (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' });

                        <td class="px-7 py-4 min-w-[190px]">

        // Form Submission (solo existe en la página de Personal)
        // NOTA: como la app es una SPA que reemplaza document.body.innerHTML en cada
        // navigate(), este formulario no existe todavía cuando el <script> se ejecuta
        // por primera vez (se ejecuta sobre index.html). Por eso la vinculación del
        // evento se hace en una función reutilizable, invocada desde runPageInit()
        // cada vez que se carga la página de Personal, con una bandera para no
        // duplicar el listener si runPageInit() se ejecuta varias veces.
        function setupEmployeeForm() {
            const form = document.getElementById('employee-form');
            if (!form || form.dataset.submitBound === '1') return;
            form.dataset.submitBound = '1';
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const modalidad = document.getElementById('emp-modalidad')?.value || 'registrar';
                const newEmp = {
                    id: document.getElementById('emp-id').value.trim(),
                    apellido: document.getElementById('emp-apellido').value.trim(),
                    nombre: document.getElementById('emp-nombre').value.trim(),
                    agencia: document.getElementById('emp-agencia').value,
                    fecha: document.getElementById('emp-fecha').value,
                    area: document.getElementById('emp-area').value,
                    modalidadIngreso: modalidad,
                    estado: 'Activo',
                    cargo: ''
                };

                if (!newEmp.id || !newEmp.apellido || !newEmp.nombre || !newEmp.agencia || !newEmp.fecha || !newEmp.area) {
                    showNotification('Completa todos los campos obligatorios.', 'error');
                    return;
                }

                if (employees.some(emp => emp.id === newEmp.id)) {
                    showNotification('El ID o Documento ya se encuentra registrado en el sistema.', 'error');
                    return;
                }

                employees.push(newEmp);
                saveData();
                form.reset();
                renderRegistroTable();
                showNotification(modalidad === 'unirme' ? 'Te has unido correctamente y apareces como personal activo.' : 'Trabajador registrado y guardado automáticamente.', 'success');
            });
        }

        function openEditEmployee(empId) {

            document.getElementById('edit-emp-original-id').value = emp.id;

            document.getElementById('edit-emp-agencia').value = (emp.agencia || '').toUpperCase();
            document.getElementById('edit-emp-fecha').value = emp.fecha || '';
            document.getElementById('edit-emp-area').value = (emp.area || '').toUpperCase();
            document.getElementById('edit-emp-cargo').value = emp.cargo || '';

        // Igual que con employee-form: se vincula desde runPageInit() con bandera
        // anti-duplicado, porque el modal de edición tampoco existe cuando el
        // <script> se ejecuta por primera vez (sobre index.html).
        function setupEditEmployeeForm() {
            const form = document.getElementById('edit-employee-form');
            if (!form || form.dataset.submitBound === '1') return;
            form.dataset.submitBound = '1';
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const originalId = document.getElementById('edit-emp-original-id').value;
                const index = employees.findIndex(e => e.id === originalId);
                if (index === -1) return showNotification('No se encontró el trabajador.', 'error');
                const newId = document.getElementById('edit-emp-id').value.trim();
                if (employees.some((emp, i) => i !== index && emp.id === newId)) {
                    return showNotification('El ID o Documento ya se encuentra registrado en el sistema.', 'error');
                }
                const previousArea = employees[index].area;
                const newArea = document.getElementById('edit-emp-area').value.toUpperCase();
                employees[index] = {
                    ...employees[index],
                    id: newId,
                    apellido: document.getElementById('edit-emp-apellido').value.trim(),
                    nombre: document.getElementById('edit-emp-nombre').value.trim(),
                    agencia: document.getElementById('edit-emp-agencia').value.toUpperCase(),
                    fecha: document.getElementById('edit-emp-fecha').value,
                    area: newArea,
                    cargo: document.getElementById('edit-emp-cargo').value.trim()
                };

                if (previousArea !== newArea) {
                    // Las asignaciones de horario están ligadas al área seleccionada.
                    Object.values(shiftSchedule).forEach(schedule => {
                        ['turno1','turno2','turno3'].forEach(shift => {
                            if (Array.isArray(schedule[shift])) schedule[shift] = schedule[shift].filter(id => id !== originalId && id !== newId);
                        });
                    });
                } else if (originalId !== newId) {
                    Object.values(shiftSchedule).forEach(schedule => {
                        ['turno1','turno2','turno3'].forEach(shift => {
                            if (Array.isArray(schedule[shift])) schedule[shift] = schedule[shift].map(id => id === originalId ? newId : id);
                        });
                    });
                }
                saveData();
                renderRegistroTable();
                if (typeof renderSchedule === 'function') renderSchedule();
                closeEditEmployee();
                showNotification('Datos del trabajador actualizados y guardados.', 'success');
            });
        }

            const index = employees.findIndex(e => e.id === empId);
            if (index > -1) {
                const removedEmp = employees.splice(index, 1)[0];
                
                const now = new Date();

                saveData();

        function escapeNormaHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }

        // Usada al pintar la fila de cada trabajador en la tabla de Personal.
        // Antes no estaba definida en ningún lugar del código: cada vez que se
        // agregaba un trabajador y se intentaba dibujar su fila, el navegador
        // lanzaba "escapeHtml is not defined" y la tabla se quedaba sin
        // actualizar (por eso el trabajador "no aparecía" tras registrarlo).
        function escapeHtml(value) {
            return escapeNormaHtml(value);
        }

        function formatNormaHours(value) {
            const n = Number(value) || 0;
            if (Number.isInteger(n)) return String(n);
            return n.toFixed(2).replace(/0+$/, '').replace(/\.$/, '').replace('.', ',');
        }

        function formatNormaScore(value) {
            const n = Number(value);
            if (!Number.isFinite(n)) return '0';
            return new Intl.NumberFormat('es-ES', { useGrouping: false, maximumFractionDigits: 12 }).format(n);
        }

        function normaTimeToMinutes(value) {
            if (!value || !/^\d{2}:\d{2}$/.test(value)) return null;
            const [h, m] = value.split(':').map(Number);
            if (h > 23 || m > 59) return null;
            return h * 60 + m;
        }

        function calculateNormaHours(start, end) {
            const startMin = normaTimeToMinutes(start);
            const endMin = normaTimeToMinutes(end);
            if (startMin === null || endMin === null) return null;
            let diff = endMin - startMin;
            // Permite turnos que cruzan medianoche.
            if (diff < 0) diff += 24 * 60;
            if (diff === 0) return 0;
            return Number((diff / 60).toFixed(2));
        }

        function updateNormaDurationPreview() {
            const start = document.getElementById('production-start-time')?.value || '';
            const end = document.getElementById('production-end-time')?.value || '';
            const hours = calculateNormaHours(start, end);
            const preview = document.getElementById('production-duration-preview');
            if (preview) preview.textContent = hours === null ? '0 h' : `${formatNormaHours(hours)} h`;
            return hours;
        }

        function updateNormaEditPreview() {
            const start = document.getElementById('norma-edit-start')?.value || '';
            const end = document.getElementById('norma-edit-end')?.value || '';
            const hours = calculateNormaHours(start, end);
            const preview = document.getElementById('norma-edit-hours-preview');
            if (preview) preview.textContent = hours === null ? '0 h' : `${formatNormaHours(hours)} h`;
            return hours;
        }

        function updateProductionAssistanceMenu() {
            const panel = document.getElementById('production-assistance-menu');
            const areaEl = document.getElementById('select-area-asistencia');
            if (!panel || !areaEl) return;
            const isProduction = String(areaEl.value || '').trim().toUpperCase() === 'PRODUCCIÓN';
            panel.classList.toggle('hidden', !isProduction);
            if (!isProduction) return;

            const workerSelect = document.getElementById('production-worker-select');
            if (!workerSelect) return;
            const activeWorkers = employees
                .filter(emp => emp.estado === 'Activo' && String(emp.area || '').toUpperCase() === 'PRODUCCIÓN')
                .slice()
                .sort((a,b) => {
                    const last = (a.apellido || '').localeCompare((b.apellido || ''), 'es', { sensitivity: 'base' });
                    return last || (a.nombre || '').localeCompare((b.nombre || ''), 'es', { sensitivity: 'base' });
                });
            const previous = workerSelect.value;
            workerSelect.innerHTML = '<option value="">Seleccionar trabajador</option>' + activeWorkers.map(emp => `<option value="${escapeNormaHtml(emp.id)}">${escapeNormaHtml(emp.nombre)} ${escapeNormaHtml(emp.apellido)} · ID ${escapeNormaHtml(emp.id)}</option>`).join('');
            if (activeWorkers.some(emp => String(emp.id) === String(previous))) workerSelect.value = previous;
        }

        function saveProductionAssistanceRecord() {
            const area = document.getElementById('select-area-asistencia')?.value || '';
            if (String(area).trim().toUpperCase() !== 'PRODUCCIÓN') {
                showNotification('NORMA solo está disponible en Producción.', 'error');
                return;
            }
            const workerSelect = document.getElementById('production-worker-select');
            const reasonSelect = document.getElementById('production-reason-select');
            const startEl = document.getElementById('production-start-time');
            const endEl = document.getElementById('production-end-time');
            const empId = workerSelect?.value || '';
            const reason = reasonSelect?.value || '';
            const start = startEl?.value || '';
            const end = endEl?.value || '';
            const hours = calculateNormaHours(start, end);
            if (!empId || !reason || !start || !end) {
                showNotification('Selecciona trabajador, motivo, hora desde y hora hasta.', 'error');
                return;
            }
            if (hours === null || hours <= 0) {
                showNotification('La hora de finalización debe producir un tiempo mayor que 0.', 'error');
                return;
            }
            const employee = employees.find(emp => String(emp.id) === String(empId));
            if (!employee) {
                showNotification('No se encontró el trabajador seleccionado.', 'error');
                return;
            }
            const now = new Date();
            const date = now.toISOString().slice(0,10);
            normaRecords[empId] ||= [];
            normaRecords[empId].push({
                id: `${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
                workerId: employee.id,
                workerName: `${employee.nombre} ${employee.apellido}`,
                reason,
                start,
                end,
                hours,
                date,
                createdAt: now.toISOString()
            });
            saveData();
            reasonSelect.value = '';
            startEl.value = '';
            endEl.value = '';
            updateNormaDurationPreview();
            showNotification(`${formatNormaHours(hours)} h agregadas a ${employee.nombre} ${employee.apellido}.`, 'success');
        }

        function getTodayIsoDate() {
            const d = new Date();
            return d.toISOString().slice(0,10);
        }

        function getAwariaDay(date = getTodayIsoDate()) {
            if (!awariaRecords[date] || typeof awariaRecords[date] !== 'object') awariaRecords[date] = { blokady: [], zamyk: [] };
            awariaRecords[date].blokady = Array.isArray(awariaRecords[date].blokady) ? [...new Set(awariaRecords[date].blokady.map(String))] : [];
            awariaRecords[date].zamyk = Array.isArray(awariaRecords[date].zamyk) ? [...new Set(awariaRecords[date].zamyk.map(String))] : [];
            return awariaRecords[date];
        }

        function openAwariaPanel() {
            const dialog = document.getElementById('awaria-dialog');
            if (!dialog) return;
            const dateEl = document.getElementById('awaria-date');
            if (dateEl && !dateEl.value) dateEl.value = getTodayIsoDate();
            renderAwariaWorkerList();
            dialog.showModal();
        }

        function closeAwariaPanel() {
            document.getElementById('awaria-dialog')?.close();
        }

        function renderAwariaWorkerList() {
            const list = document.getElementById('awaria-worker-list');
            const reason = document.getElementById('awaria-reason')?.value || 'blokady';
            const date = document.getElementById('awaria-date')?.value || getTodayIsoDate();
            if (!list) return;
            const workers = getProductionEmployees();
            const assigned = new Set(getAwariaDay(date)[reason] || []);
            list.innerHTML = workers.length ? workers.map(emp => {
                const checked = assigned.has(String(emp.id));
                return `<label class=\"awaria-worker-row\"><span><strong>${escapeNormaHtml(emp.apellido)}</strong><small>${escapeNormaHtml(emp.nombre)}</small></span><button type=\"button\" class=\"awaria-toggle ${checked ? 'is-on' : ''}\" onclick=\"toggleAwariaWorker('${escapeNormaHtml(emp.id)}', this)\" aria-pressed=\"${checked}\">${checked ? 'X' : '—'}</button></label>`;
            }).join('') : '<div class=\"awaria-empty\">No hay trabajadores activos de Producción.</div>';
        }

        function toggleAwariaWorker(workerId, buttonEl) {
            const reason = document.getElementById('awaria-reason')?.value || 'blokady';
            const date = document.getElementById('awaria-date')?.value || getTodayIsoDate();
            const day = getAwariaDay(date);
            const list = day[reason];
            const idx = list.findIndex(id => String(id) === String(workerId));
            if (idx >= 0) list.splice(idx, 1); else list.push(String(workerId));
            saveData();
            if (buttonEl) {
                const active = idx < 0;
                buttonEl.classList.toggle('is-on', active);
                buttonEl.setAttribute('aria-pressed', String(active));
                buttonEl.textContent = active ? 'X' : '—';
            }
        }

        function deleteNormaRecord(recordId) {
            let removed = false;
            Object.keys(normaRecords || {}).forEach(workerId => {
                if (!Array.isArray(normaRecords[workerId])) return;
                const before = normaRecords[workerId].length;
                normaRecords[workerId] = normaRecords[workerId].filter(r => String(r.id) !== String(recordId));
                if (normaRecords[workerId].length !== before) removed = true;
                if (!normaRecords[workerId].length) delete normaRecords[workerId];
            });
            if (!removed) { showNotification('No se encontró el registro NORMA.', 'error'); return; }
            saveData();
            renderNormaHistory();
            showNotification('Registro NORMA eliminado.', 'success');
        }

                    const last = (a.apellido || '').localeCompare((b.apellido || ''), 'es', { sensitivity: 'base' });

        function normaScoreTone(score) {
            if (score < 13) return { cls:'norma-score-bad', label:'Bajo' };
            if (score < 17) return { cls:'norma-score-regular', label:'Regular' };
            return { cls:'norma-score-best', label:'Mejor nivel' };
        }

        function renderNormaRankingBanners() {
            const bestEl = document.getElementById('norma-top-best-list');
            const worstEl = document.getElementById('norma-top-worst-list');
            if (!bestEl && !worstEl) return;
            const workers = getProductionEmployees().map(emp => ({ emp, score:getNormaScore(emp.id) }));
            const best = workers.filter(x => x.score >= 17).sort((a,b)=>b.score-a.score || (a.emp.apellido||'').localeCompare(b.emp.apellido||'','es'));
            const regular = workers.filter(x => x.score >= 13 && x.score < 17).sort((a,b)=>b.score-a.score || (a.emp.apellido||'').localeCompare(b.emp.apellido||'','es'));
            const worst = workers.filter(x => x.score < 13).sort((a,b)=>a.score-b.score || (a.emp.apellido||'').localeCompare(b.emp.apellido||'','es'));
            const row = (item, i, podium) => { const tone=normaScoreTone(item.score); return `<div class="norma-rank-row"><div class="norma-rank-position">${podium ? i+1 : '•'}</div><div class="norma-rank-name"><strong>${escapeNormaHtml(item.emp.apellido)}</strong><span>${escapeNormaHtml(item.emp.nombre || '')}</span></div><div class="norma-rank-score ${tone.cls}">${formatNormaScore(item.score)}</div></div>`; };
            if (bestEl) bestEl.innerHTML = best.length ? best.map((x,i)=>row(x,i,true)).join('') : '<div class="norma-ranking-empty">No hay trabajadores de Producción con 17 o más.</div>';
            if (worstEl) worstEl.innerHTML = worst.length ? worst.map((x,i)=>row(x,i,false)).join('') : '<div class="norma-ranking-empty">No hay trabajadores de Producción por debajo de 13.</div>';
            const regularEl = document.getElementById('norma-top-regular-list');
            if (regularEl) regularEl.innerHTML = regular.length ? regular.map((x,i)=>row(x,i,false)).join('') : '<div class="norma-ranking-empty">No hay trabajadores entre 13 y 16,99.</div>';

        function saveNormaEdit() {
            const id = document.getElementById('norma-edit-id')?.value;
            const workerId = document.getElementById('norma-edit-worker')?.value || '';
            const date = document.getElementById('norma-edit-date')?.value;
            const reason = document.getElementById('norma-edit-reason')?.value;
            const start = document.getElementById('norma-edit-start')?.value || '';
            const end = document.getElementById('norma-edit-end')?.value || '';
            const computedHours = calculateNormaHours(start, end);
            if (!id || !workerId || !date || !reason || !start || !end || computedHours === null || computedHours <= 0) {
                showNotification('Completa trabajador, fecha, motivo, hora desde y hora hasta.', 'error'); return;
            }
            let found = null;
            Object.keys(normaRecords || {}).some(oldWorkerId => {
                if (!Array.isArray(normaRecords[oldWorkerId])) return false;
                const idx = normaRecords[oldWorkerId].findIndex(r=>String(r.id)===String(id));
                if (idx === -1) return false;
                found = normaRecords[oldWorkerId].splice(idx,1)[0];
                if (!normaRecords[oldWorkerId].length) delete normaRecords[oldWorkerId];
                return true;
            });
            if (found) {
                const emp = employees.find(e=>String(e.id)===String(workerId));
                found = {...found, workerId, workerName: emp ? `${emp.nombre} ${emp.apellido}` : found.workerName, date, reason, start, end, hours: computedHours};
                normaRecords[workerId] ||= [];
                normaRecords[workerId].push(found);
            }
            if (!found) { showNotification('No se encontró el registro.', 'error'); return; }
            saveData(); closeNormaEdit(); renderNormaHistory(); showNotification('Registro NORMA actualizado.', 'success');
        }

        function renderAttendanceTable() {
            const areaSelectEl = document.getElementById('select-area-asistencia');
            if (!areaSelectEl) return;
            const selectedArea = areaSelectEl.value;
            const thead = document.getElementById('attendance-thead');
            const tbody = document.getElementById('attendance-tbody');

            thead.innerHTML = '';
            tbody.innerHTML = '';

            if (!selectedArea) {
                promptState.classList.remove('hidden');
                promptState.classList.add('flex');
                noneState.classList.add('hidden');
                noneState.classList.remove('flex');
                return;
            } else {
                promptState.classList.add('hidden');
                promptState.classList.remove('flex');
            }

            const daysCount = getDaysInMonth(currentYear, currentSelectedMonth);
            const activeEmployeesInArea = employees.filter(e => e.estado === 'Activo' && e.area === selectedArea);

            if (activeEmployeesInArea.length === 0) {

                noneState.classList.add('flex');

            // Build Header Row with 31 days
